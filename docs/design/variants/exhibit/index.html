:root {
  --ground: #fbfbf8; --sheet: #ffffff; --sunk: #f3f2ed;
  --ink: #111214; --ink-2: #45474d; --ink-3: #64666c;
  --rule: #e4e3dd; --rule-2: #cfcdc4;
  --manila: #e9dcb6; --manila-2: #f5eedb; --manila-ink: #5e4f22;
  --carbon: #2a3f9a; --carbon-ink: #ffffff; --carbon-tint: #edf0f9; --carbon-hover: #22337f;
  --tamper: #cf2330; --tamper-ink: #ffffff; --tamper-tint: #fbe9ea;
  --ok: #2c6a37; --ok-tint: #e5f0e3;
  --warn: #7c5300; --warn-tint: #faefd2;
  --bad: #a6271e;
  --check: #8d9096;
  --float: 0 1px 2px rgb(17 18 20 / .06), 0 10px 24px -10px rgb(17 18 20 / .22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121317; --sheet: #191b20; --sunk: #0e0f12;
    --ink: #ecebe6; --ink-2: #b8b9bd; --ink-3: #9a9ca2;
    --rule: #2a2c33; --rule-2: #3a3d45;
    --manila: #8a7442; --manila-2: #29241a; --manila-ink: #f3e7c4;
    --carbon: #9aaeff; --carbon-ink: #10152e; --carbon-tint: #1d2340; --carbon-hover: #b6c4ff;
    --tamper: #c9353e; --tamper-ink: #ffffff; --tamper-tint: #3a171b;
    --ok: #86c891; --ok-tint: #17291b;
    --warn: #e8bc5e; --warn-tint: #2f2610;
    --bad: #ff8a80;
    --check: #6c6f77;
    --float: 0 1px 2px rgb(0 0 0 / .3), 0 12px 28px -10px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #121317; --sheet: #191b20; --sunk: #0e0f12;
  --ink: #ecebe6; --ink-2: #b8b9bd; --ink-3: #9a9ca2;
  --rule: #2a2c33; --rule-2: #3a3d45;
  --manila: #8a7442; --manila-2: #29241a; --manila-ink: #f3e7c4;
  --carbon: #9aaeff; --carbon-ink: #10152e; --carbon-tint: #1d2340; --carbon-hover: #b6c4ff;
  --tamper: #c9353e; --tamper-ink: #ffffff; --tamper-tint: #3a171b;
  --ok: #86c891; --ok-tint: #17291b;
  --warn: #e8bc5e; --warn-tint: #2f2610;
  --bad: #ff8a80;
  --check: #6c6f77;
  --float: 0 1px 2px rgb(0 0 0 / .3), 0 12px 28px -10px rgb(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--ground); color: var(--ink); }
body { margin: 0; font: 400 15px/1.45 "Hanken Grotesk", system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
::selection { background: var(--carbon-tint); color: var(--ink); }
:focus-visible { outline: 2px solid var(--carbon); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, p { margin: 0; }
h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; line-height: 1.3; font-weight: 700; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .87em; }
.stack { display: grid; gap: 16px; align-content: start; }
.field.end { align-content: end; }
.hint { color: var(--ink-2); font-size: 13px; line-height: 1.45; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* prototype chrome */
.proto { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--ground); position: sticky; top: 0; z-index: 10; }
.proto h1 { font-size: 17px; }
.proto p { color: var(--ink-3); font-size: 13px; flex: 1 1 260px; }
.stage { display: flex; gap: 32px; padding: 24px; align-items: flex-start; }
.cap { font-size: 12px; color: var(--ink-3); margin: 0 0 8px; }
[data-frame] { background: var(--ground); border: 1px solid var(--rule-2); overflow: hidden; box-shadow: var(--float); }
[data-frame="phone"] { width: 390px; height: 844px; border-radius: 28px; }
[data-frame="desktop"] { width: 1280px; height: 800px; border-radius: 10px; transform: scale(var(--scale, 1)); transform-origin: 0 0; position: absolute; top: 0; left: 0; }
.desk-col { flex: 1 1 auto; min-width: 0; }
[data-desktop-wrap] { position: relative; }
.scroller { height: 100%; overflow: auto; }
body[data-view="phone"] .desk-col { display: none; }
body[data-view="desktop"] .phone-wrap { display: none; }
@media (max-width: 720px) {
  .proto { padding: 10px 16px; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .proto { position: static; }
  .stage { padding: 0; flex: 1; min-height: 0; }
  .phone-wrap { height: 100%; }
  .desk-col, .cap { display: none; }
  [data-frame="phone"] { width: 100vw; height: 100%; border-radius: 0; border: 0; box-shadow: none; }
}

/* controls */
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); min-height: 32px; }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--carbon-tint); color: var(--carbon); font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--sheet); font-weight: 700; font-size: 14px; transition: background-color .16s, border-color .16s; }
.btn:hover { background: var(--sunk); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn.primary { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.btn.primary:hover { background: var(--carbon-hover); border-color: var(--carbon-hover); }
.btn.primary:disabled { background: var(--rule); border-color: var(--rule); color: var(--ink-3); cursor: default; }
.btn.wide { width: 100%; min-height: 48px; font-size: 15px; }
.btn.ghost { background: none; }
.link { border: 0; background: none; padding: 0; color: var(--carbon); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; display: inline-flex; align-items: center; gap: 4px; }
.input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--sheet); }
.input:focus { outline: 2px solid var(--carbon); outline-offset: -1px; }
.input.err { border-color: var(--bad); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 3px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.chip .i { width: 13px; height: 13px; }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.chip.join { background: var(--tamper); color: var(--tamper-ink); }

/* amounts */
.amt { white-space: nowrap; font-weight: 500; }
.amt .lead { color: var(--ink-3); font-weight: 400; }
.amt.in { color: var(--ok); }
.amt.in .lead { color: inherit; opacity: .75; }
.amt .unit { font-size: .62em; color: var(--ink-3); margin-left: .3em; font-weight: 700; letter-spacing: .04em; }
.flash { animation: flash .6s cubic-bezier(.2, .8, .2, 1); border-radius: 3px; }
@keyframes flash { from { background: var(--carbon-tint); } to { background: transparent; } }

/* the exhibit tag: a manila luggage tag with a punched hole */
.tag { display: inline-flex; align-items: center; justify-content: center; height: 22px; min-width: 34px; padding: 0 7px 0 13px; background: var(--manila); color: var(--manila-ink); font-weight: 700; font-size: 12px; letter-spacing: .03em; clip-path: polygon(7px 0, 100% 0, 100% 100%, 7px 100%, 0 50%); position: relative; flex: none; }
.tag::before { content: ""; position: absolute; left: 6px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--ground); }
.tag.lg { height: 26px; min-width: 40px; font-size: 14px; padding-left: 15px; }
.tag.lg::before { left: 7px; }
.tag.on { background: var(--carbon); color: var(--carbon-ink); }

    const grow = !opts.still && n > 1 && n > lastJoined;
    const entries = p.linked.map((l, i) => {
      const total = l.coins.reduce((a, c) => a + c.value, 0);
      const isNew = !opts.still && !before.has(l.id);
      return `<li class="entry${isNew ? " new" : ""}"><span class="num">${String(i + 1).padStart(2, "0")}</span>
        <div>${tag(l.name, "lg")}<span class="who${l.kyc ? " kyc" : ""}">${l.note}</span>
        <span class="coinsline who">${l.coins.length} coin${l.coins.length > 1 ? "s" : ""} picked</span></div>${amt(total)}</li>`;
    }).join("");
    const from = lastJoined > 1 ? (lastJoined - 1) / n : 0;
    const log = `<ol class="log${n > 1 ? " joined" : ""}${grow ? " grow" : ""}" data-from="${from}">${entries}</ol>`;
    return n > 1
      ? `${log}<div class="tape">${I("join")}Joined in one transaction</div>`
      : `${log}<div class="clear">${I("check")}<span>No new links. Every coin picked comes from ${p.linked[0].name}, which is already linked.</span></div>`;
  }

  function verdict() {
    const p = P.privacy();
    const n = p.linked.length;
    if (n < 2) return "";
    const names = p.linked.map((l) => l.name);
    let why = "";
    if (p.kyc.length && p.nonKyc.length) {
      const k = p.kyc.map((s) => s.short).join(" and "), nk = p.nonKyc.map((s) => s.name).join(" and ");
      why = `<p class="why">${k} ${p.kyc.length > 1 ? "know" : "knows"} who you are, so ${nk} would stop being private.</p>`;
    }
    const alt = p.alt ? `<div class="suggest"><span>Spend only ${p.alt.name} instead. ${amt(p.alt.total)} covers this payment.</span><button class="btn sm" data-act="alt">Use only those coins</button></div>` : "";
    let known = "";
    if (!p.alt && p.kyc.length && p.nonKyc.length) {
      const pool = kycPool();
      known = pool.ok
        ? `<div class="suggest"><span>No single source covers this payment. Use only coins from sources that already know who you are, ${list(pool.names)}, and ${list(p.nonKyc.map((s) => s.name))} stays private.</span><button class="btn sm" data-act="known">Use only those coins</button></div>`
        : `<p class="why">No single source covers this payment, and neither do the sources that already know you, so some private coins have to be joined.</p>`;
    }
    const foreign = p.foreign.length ? `<div class="warnbox">${I("warn")}<span>${p.foreign.map((c) => c.label).join(", ")} is an unconfirmed payment from someone else. They can still replace it, and this transaction would fail with it.</span></div>` : "";
    return `<div class="verdict"><p>This spends coins from ${words[n]} separate sources, permanently linking them: ${list(names)}. Anyone reading the chain can assume they belong to one person.</p>${why}${alt}${known}${foreign}</div>`;
  }

  // Every spendable coin from an exhibit that already has your identity.
  function kycPool() {
    const cs = P.coins.filter((c) => P.spendable(c) && P.sources[c.source].kyc && c.status !== "foreign-unconfirmed");
    const sel = new Set(S.selected);
    S.selected = new Set(cs.map((c) => c.id));
    const ok = P.txSummary().ok;
    S.selected = sel;
    return { coins: cs, ok, names: [...new Set(cs.map((c) => P.sources[c.source].name))] };
  }
  document.addEventListener("click", (e) => {
    if (!e.target.closest("[data-act=known]")) return;
    S.selected = new Set(kycPool().coins.map((c) => c.id));
    P.rerender();
  });

  const eta = (rate) => {
    const b = P.blocksFor(rate), m = b * 10;
    return m < 60 ? `about ${m} min` : m < 240 ? `about ${Math.round(m / 60)} hour${m >= 90 ? "s" : ""}` : "several hours";
  };
  const presetName = { next: "Fast", hour: "Within an hour", economy: "Economy", floor: "No rush" };

  // shells
  function topbar(kind, here) {
    const w = P.wallets.find((x) => x.id === S.wallet);
    const menu = P.wallets.map((x) => `<button data-act="wallet" data-v="${x.id}" aria-current="${x.id === S.wallet}"><span>${x.name}</span><small>${x.kind} &middot; ${x.network}</small></button>`).join("") +
      `<button><span class="link">Add a wallet</span></button>`;
    const sw = `<details class="wsw"><summary><span>${w.name}${kind === "desktop" ? ` <span class="wmeta">${w.kind}</span>` : ""}</span>${w.network !== "mainnet" ? `<span class="net">${w.network}</span>` : ""}${I("chev")}</summary><div class="menu">${menu}</div></details>`;
    if (kind === "phone") {
      return `<header class="bar">${sw}<div class="status"><span class="dot" aria-hidden="true"></span><span>${P.sats(P.TIP)}</span></div><button class="iconbtn" aria-label="Lock">${I("lock")}</button></header>`;
    }
    const nav = [["home", "Home"], ["send", "Send"], ["recv", "Receive"], ["coins", "Coins"], ["addr", "Addresses"]]
      .map(([id, n]) => `<button ${["home", "send"].includes(id) ? `data-goto="${id}"` : ""} ${here === id ? 'aria-current="page"' : ""}>${n}</button>`).join("");
    return `<header class="bar">${sw}<nav class="nav" aria-label="Main">${nav}</nav><div class="status"><span class="dot" aria-hidden="true"></span><span>Connected to <b>${SERVER}</b> &middot; block ${P.sats(P.TIP)}</span></div><button class="iconbtn" aria-label="Lock">${I("lock")}</button></header>`;
  }
  function tabbar(here) {
    const t = [["home", "Home", "home"], ["send", "Send", "send"], ["recv", "Receive", "recv"], ["coins", "Coins", "coins"]];
    return `<nav class="tabs" aria-label="Main">${t.map(([id, n, i]) => `<button ${["home", "send"].includes(id) ? `data-goto="${id}"` : ""} ${here === id ? 'aria-current="page"' : ""}>${I(i)}${n}</button>`).join("")}</nav>`;
  }

  // screens
  function connect(kind) {
    const host = S.server.replace("wss://", "");
    const broken = S.connection === "cert";
    const wire = `<div class="wire" role="img" aria-label="${broken ? "The connection from this tab to your server stops at the certificate." : "This tab talks only to your server."}">
      <span>This tab</span><span class="ln ok"></span>${broken ? `<span class="x">${I("warn")}Certificate</span><span class="ln"></span>` : ""}<span>Your server</span></div>`;
    const form = `<div class="form">
      <div class="field"><label for="srv-${kind}">Electrum server address</label>
        <input id="srv-${kind}" class="input mono${broken ? " err" : ""}" value="${S.server}" spellcheck="false" autocomplete="off" inputmode="url" aria-describedby="srvh-${kind}">
        <p class="hint" id="srvh-${kind}">wss:// and the port your server listens on for WebSocket Secure, often 50004.</p></div>
      ${S.connection === "connecting" ? `<div class="connecting">Connecting to ${host}. Waiting up to 10 seconds for an answer.</div>` : ""}
      <button class="btn primary wide" data-act="conn" data-v="connecting">${broken ? I("retry") + "Retry connection" : "Connect"}</button>
      <div class="recent"><span class="lbl">Used before</span>
        <button><span class="mono">wss://${SERVER}:50004</span><small>3 days ago</small></button></div>
      <p class="hint">There is no default or public server. If yours is unreachable, this app does nothing rather than ask someone else.</p>
    </div>`;
    const guide = broken ? `<section class="report" aria-live="polite">
      <div class="rh">${I("warn")}<h2>The browser rejected this server's certificate</h2><p class="hint">Your server at <span class="mono">${host}</span> answered, but with a certificate this browser does not trust, usually because it is self-signed. WebSocket connections have no "proceed anyway" button, so you accept it once in an ordinary tab.</p></div>
      <div class="rb">
        <ol class="steps">
          <li><div><b>Open the server's https address in a new tab.</b><br><span class="url mono">https://${host}</span><button class="link">Open it ${I("ext")}</button></div></li>
          <li><div><b>Check the warning is about your own server, then accept it.</b> In Chrome choose Advanced, then Proceed. In Firefox choose Advanced, then Accept the Risk. In Safari choose Show Details, then visit this website.</div></li>
          <li><div><b>Expect a blank page or an error there.</b> That is normal; the server only speaks Electrum. Close the tab.</div></li>
          <li><div><b>Come back and choose Retry connection.</b></div></li>
        </ol>
        <div class="alts">
          <p>To stop this happening on every device, give your server a real certificate. Tailscale is one way. <button class="link">Read the certificate guide</button></p>
          <p>Running this app from the local container? It can use plain ws:// on your own network.</p>
        </div>
      </div></section>` : `<section class="panel"><div class="ph"><h2>What happens when you connect</h2></div><div class="pb"><p class="hint">The app asks your server for block headers and the history of your addresses. Your addresses and transactions go to that server and nowhere else.</p></div></section>`;
    const pick = `<div class="statepick">Prototype state: <div class="seg"><button data-act="conn" data-v="idle" aria-pressed="${S.connection === "idle"}">First visit</button><button data-act="conn" data-v="connecting" aria-pressed="${S.connection === "connecting"}">Connecting</button><button data-act="conn" data-v="cert" aria-pressed="${S.connection === "cert"}">Certificate rejected</button></div></div>`;
    return `<div class="app ${kind}"><div class="conn"><div><h1>Connect to your Electrum server</h1><p class="lede">This wallet talks only to a server you run. Nothing about your wallet is sent anywhere else.</p></div>${wire}<div class="conn-grid">${form}${guide}</div>${pick}</div></div>`;
  }

  function home(kind) {
    const b = P.balances();
    const balance = `<section class="panel"><div class="bal"><span class="lbl">Confirmed balance</span><span class="big">${amt(b.confirmed, { unit: true })}</span></div>
      <div class="bal-rows"><div><span>Unconfirmed</span>${amt(b.unconfirmed, { plus: true })}</div><div><span>Frozen, not spendable</span>${amt(b.frozen)}</div></div>
      <div class="sync"><span class="dot" aria-hidden="true"></span><span>Up to date at block ${P.sats(P.TIP)}. Watching ${SERVER}.</span></div></section>`;
    const totals = {};
    for (const c of P.coins) totals[c.source] = (totals[c.source] || 0) + c.value;
    const key = `<section class="panel"><div class="ph"><h2>Sources</h2><span class="aside">Coins already linked to each other</span></div><div class="key">${P.sourceOrder.map((sid) => `<div class="key-row"><div>${tag(P.sources[sid].name, "lg")}<small>${P.sources[sid].note}</small></div>${amt(totals[sid])}</div>`).join("")}</div></section>`;
    const confTxt = (h) => (h == null ? `<span class="chip warn">Unconfirmed</span>` : `${P.sats(P.confs(h))} conf`);
    const sub = (t) => {
      let s = "";
      if (t.height == null && t.amount < 0) s += `<span class="chip">Replaceable, ${t.feeRate} sat/vB</span><button class="btn sm">Bump fee</button>`;
      if (t.height == null && t.amount > 0) s += `<span class="chip warn">From someone else, can still be replaced</span>`;
      return s ? `<div class="sub">${s}</div>` : "";
    };
    let hist;
    if (kind === "desktop") {
      hist = `<section class="panel"><div class="ph"><h2>Transactions</h2><label class="search">${I("search")}<span class="sr">Search transactions</span><input placeholder="Label, amount or date"></label></div><div class="pb"><table class="hist"><thead><tr><th>Date</th><th>Label</th><th class="r">Confirmations</th><th class="r">Amount</th></tr></thead><tbody>${P.history.map((t) => `<tr><td class="when">${P.dateOf(t.time)}<br>${P.timeOf(t.time)}</td><td>${rowTag(t)}<span class="lab">${t.label}</span>${sub(t)}</td><td class="r when">${confTxt(t.height)}</td><td class="r">${amt(t.amount, { plus: true })}</td></tr>`).join("")}</tbody></table></div></section>`;
    } else {
      hist = `<section class="panel"><div class="ph"><h2>Transactions</h2><span class="aside">Newest first</span></div><div class="pb">${P.history.map((t) => `<div class="hrow"><span class="lab">${rowTag(t)}${t.label}</span>${amt(t.amount, { plus: true })}<span class="meta">${P.dateOf(t.time)} &middot; ${t.height == null ? "unconfirmed" : P.sats(P.confs(t.height)) + " conf"}</span><span></span>${sub(t)}</div>`).join("")}</div></section>`;
    }
    const left = kind === "desktop" ? `<div class="stack">${balance}${key}</div>` : balance;
    return `<div class="app ${kind}">${topbar(kind, "home")}<div class="main home">${left}${hist}${kind === "phone" ? key : ""}</div>${kind === "phone" ? tabbar("home") : ""}</div>`;
  }

  const rowTag = (t) => { const c = P.coins.find((x) => x.label === t.label); return c ? tag(P.sources[c.source].short) + " " : ""; };

  function coinRow(c) {
    const sel = S.selected.has(c.id), ok = P.spendable(c);
    const chips = [];
    if (c.frozen) chips.push(`<span class="chip">${I("lock")}Frozen</span>`);
    if (c.status === "own-change") chips.push(`<span class="chip ok">Your change, unconfirmed</span>`);
    if (c.status === "foreign-unconfirmed") chips.push(`<span class="chip warn">${I("warn")}Unconfirmed, from someone else</span>`);
    const conf = c.height == null ? "0 conf" : `${P.sats(P.confs(c.height))} conf`;
    return `<button class="coin" role="checkbox" aria-checked="${sel}" ${ok ? "" : 'aria-disabled="true"'} data-act="coin" data-v="${c.id}">
      <span class="box">${sel ? `<svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>` : ""}</span>
      <span class="cv">${amt(c.value)}</span>
      <span class="cage">${P.ageOf(c)}</span>
      <span class="cconf">${conf}</span>
      <span class="cl">${c.label}</span>
      <span class="cm"><span class="cmeta-phone">${P.ageOf(c)} &middot; ${conf}</span>${chips.join("")}</span>
    </button>`;
  }

  function send(kind) {
    const tx = P.txSummary(), p = P.privacy();
    const groups = P.sourceOrder.map((sid) => {
      const cs = P.coins.filter((c) => c.source === sid);
      const s = P.sources[sid];
      const picked = cs.filter((c) => S.selected.has(c.id)).length;
      return `<div class="grp"><div class="grp-h"><div>${tag(s.name, "lg" + (picked ? " on" : ""))}<small>${s.note}</small></div><span class="tot">${picked} of ${cs.length} picked<br>${amt(cs.reduce((a, c) => a + c.value, 0))}</span></div>${cs.map(coinRow).join("")}</div>`;
    }).join("");
    const r = S.recipients[0];
    const rcpt = `<div class="rcpt">
      <div class="field"><div class="lrow"><label for="to-${kind}">Pay to</label><button class="link">${I("scan")} Scan a code</button></div><input id="to-${kind}" class="input mono" value="${r.address}" spellcheck="false"><span class="addr-ok">${I("check")}Valid mainnet address, never paid before</span></div>
      <div class="field"><label for="amt-${kind}">Amount, BTC</label><input id="amt-${kind}" class="input" value="${P.btc(r.amount)}" inputmode="decimal"></div>
      <div class="field"><label for="lab-${kind}">Label</label><input id="lab-${kind}" class="input" value="${r.label}"></div></div>`;
    const fee = `<div class="fee"><span class="lbl">Fee, from your node's mempool</span>
      <div class="presets">${P.feePresets.map((f) => `<button class="preset" data-act="fee" data-v="${f.rate}" aria-pressed="${S.feeRate === f.rate}"><b>${presetName[f.id]}</b><span>${f.rate} sat/vB, ${eta(f.rate)}</span></button>`).join("")}
      <span class="stepper"><button data-act="fee-step" data-v="-1" aria-label="Lower fee rate">−</button><input data-fee-input aria-label="Custom fee rate, sat/vB" value="${S.feeRate}" inputmode="decimal"><button data-act="fee-step" data-v="1" aria-label="Raise fee rate">+</button></span></div>
      <p class="queue">${P.aheadOf(S.feeRate).toFixed(1)} MvB in your node's mempool pays more than ${S.feeRate} sat/vB, so ${eta(S.feeRate)}.</p></div>`;
    const coins = `<div class="coins-head"><h2>Coins</h2><span class="count">${tx.sel.length} of ${P.coins.filter(P.spendable).length} picked &middot; ${amt(tx.inputs)}</span>
      <button class="btn sm" data-act="auto">Auto-select</button><button class="btn sm" data-act="clear">Clear</button></div><div class="coins">${groups}</div>`;
    const fl = (k) => (lastNums[k] !== undefined && lastNums[k] !== tx[k] ? " flash" : "");
    const summary = `<div class="sum">
      <div><span>Coins in (${tx.sel.length})</span><span class="${fl("inputs")}">${amt(tx.inputs)}</span></div>
      <div><span>Sending</span>${amt(tx.sending)}</div>
      <div><span>Fee<small>${S.feeRate} sat/vB &middot; ${tx.vbytes} vB</small></span><span class="${fl("fee")}">${P.sats(tx.fee)} sats</span></div>
      <div><span>Change back to you<small class="mono">m/84'/0'/0'/1/10</small></span><span class="${fl("change")}">${tx.change ? amt(tx.change) : "None"}</span></div>
      <div class="tot"><span>Total leaving the wallet<small>Replaceable (RBF)</small></span><span class="${fl("total")}">${amt(tx.total, { unit: true })}</span></div></div>
      ${tx.ok ? `<button class="btn primary wide" data-goto="sign">Review and sign</button>` : `<button class="btn primary wide" disabled>${tx.sel.length ? `Short by ${P.sats(tx.shortBy)} sats` : "Pick coins to pay from"}</button>`}`;
    const n = p.linked.length;
    const badge = n > 1 ? `<span class="chip join">${I("join")}Joins ${n}</span>` : "";
    const caseFile = `<aside class="case" id="case-${kind}" aria-live="polite"><h2>Custody log ${badge}</h2><p class="sub-h">What a chain analyst would write down about this transaction.</p>${custody()}${verdict()}${summary}</aside>`;
    if (kind === "desktop") {
      return `<div class="app ${kind}">${topbar(kind, "send")}<div class="main send"><div class="work">${rcpt}${fee}${coins}</div>${caseFile}</div></div>`;
    }
    const dock = `<div class="dock"><span><b>${tx.sel.length} coins</b>, ${amt(tx.inputs)} in &middot; fee ${P.sats(tx.fee)} sats</span>${tx.ok ? `<button class="btn primary sm" data-goto="sign">Review</button>` : `<button class="btn primary sm" disabled>Review</button>`}${n > 1 ? `<a class="chip join" href="#case-phone">${I("join")}Joins ${words[n]} sources, see the log</a>` : ""}</div>`;
    return `<div class="app ${kind}">${topbar(kind, "send")}<div class="main send"><div class="work">${rcpt}${fee}${coins}</div>${caseFile}</div>${dock}${tabbar("send")}</div>`;
  }

  function sign(kind) {
    const tx = P.txSummary();
    const d = P.densities[S.density];
    const st = S.signStage;
    const order = ["export", "scan", "verified"];
    const steps = [["export", "Show to signer"], ["scan", "Scan back"], ["verified", "Broadcast"]]
      .map(([id, n], i) => `<button data-act="stage" data-v="${id}" ${st === id ? 'aria-current="step"' : ""} class="${order.indexOf(st) > i ? "done" : ""}"><i>${order.indexOf(st) > i ? I("check") : i + 1}</i>${n}</button>`).join("");
    const recap = `<section class="panel recap"><h2>${S.recipients[0].label}</h2><div class="facts">
      <div><span>Sending</span>${amt(tx.sending)}</div><div><span>To</span><span class="mono">${P.short(S.recipients[0].address, 10, 8)}</span></div>
      <div><span>Fee</span><span>${P.sats(tx.fee)} sats, ${S.feeRate} sat/vB</span></div><div><span>Change</span>${amt(tx.change)}</div></div>
      ${custody({ still: true })}</section>`;
    let body;
    if (st === "export") {
      const segs = Array.from({ length: d.parts }, (_, i) => `<i data-seg="${i + 1}" class="${i + 1 === S.part ? "on" : ""}"></i>`).join("");
      body = `<section class="panel qrcard">
        <div class="qr" data-qr>${P.qrSvg(S.part, d.modules, "#101214")}</div>
        <div><h2 class="h">Show this to your signer</h2><p class="hint">On a SeedSigner choose Scan, then hold this screen steady in front of its camera. The code cycles through every part; the signer collects them in any order.</p></div>
        <div class="partline"><span class="big">Part <span data-part>${S.part}</span> <small>of ${d.parts}</small></span><span class="hint">${S.fps} a second</span></div>
        <div class="parts" aria-hidden="true">${segs}</div>
        <div class="ctrls">
          <div class="ctrl"><span class="lbl">Speed, frames per second</span><div class="seg" role="group" aria-label="Speed, frames per second">${[2, 4, 6, 8].map((f) => `<button data-act="fps" data-v="${f}" aria-pressed="${S.fps === f}">${f}</button>`).join("")}</div></div>
          <div class="ctrl"><span class="lbl">Density</span><div class="seg" role="group" aria-label="Density">${Object.entries(P.densities).map(([k, x]) => `<button data-act="density" data-v="${k}" aria-pressed="${S.density === k}">${k[0].toUpperCase() + k.slice(1)}, ${x.parts} parts</button>`).join("")}</div><p class="hint">Lower density is easier for a weak camera to read but takes longer.</p></div>
          <div class="acts"><button class="btn primary" data-act="stage" data-v="scan">${I("camera")}Signed it, scan it back</button><button class="btn">${I("file")}Save PSBT file</button></div>
        </div></section>`;
    } else if (st === "scan") {
      const cells = Array.from({ length: 40 }, (_, i) => `<i class="${S.captured.has(i + 1) ? "on" : ""}" title="Part ${i + 1}"></i>`).join("");
      body = `<section class="panel qrcard">
        <div class="viewfinder" role="img" aria-label="Camera view"><div class="q">${P.qrSvg(7, 41, "#101214")}</div><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><span class="live"><span class="dot"></span>Camera on</span></div>
        <div><h2 class="h">Point your camera at the signer</h2><p class="hint">Keep the signed code in view. Parts arrive in any order; gaps fill in as the code loops.</p></div>
        <div class="partline"><span class="big">${S.captured.size} <small>of 40 parts captured</small></span></div>
        <div class="grid40" aria-label="${S.captured.size} of 40 parts captured">${cells}</div>
        <div class="acts"><button class="btn primary" data-act="stage" data-v="verified">Simulate the last parts</button><button class="btn">${I("file")}Load signed file instead</button><button class="btn" data-act="stage" data-v="export">Back</button></div>
      </section>`;
    } else {
      body = `<section class="panel"><div class="ph"><h2>Signed and checked</h2><span class="chip ok">Ready to broadcast</span></div><div class="pb stack">
        <ul class="checks">
          <li><span class="tick">${I("check")}</span><span>Every input is signed</span><small>${tx.sel.length} of ${tx.sel.length}</small></li>
          <li><span class="tick">${I("check")}</span><span>Outputs match what you built</span><small>2 of 2</small></li>
          <li><span class="tick">${I("check")}</span><span>Fee matches</span><small>${P.sats(tx.fee)} sats</small></li>
        </ul>
        <p class="hint">Broadcasting sends the transaction to ${SERVER} only. Your server relays it to the network.</p>
        <div class="acts"><button class="btn primary">${I("broadcast")}Broadcast through your server</button><button class="btn" data-goto="send">Discard</button></div>
      </div></section>`;
    }
    return `<div class="app ${kind}">${topbar(kind, "send")}<div class="main sign"><nav class="stepnav" aria-label="Signing steps">${steps}</nav>${body}${recap}</div>${kind === "phone" ? tabbar("send") : ""}</div>`;
  }

  P.mount({
    render(screen, kind) {
      if (screen === "connect") return connect(kind);
      if (screen === "home") return home(kind);
      if (screen === "sign") return sign(kind);
      return send(kind);
    },
    after() {
      document.querySelectorAll(".log[data-from]").forEach((el) => el.style.setProperty("--from", el.dataset.from));
      lastSel = new Set(S.selected);
      lastJoined = P.privacy().linked.length;
      const tx = P.txSummary();
      lastNums = { inputs: tx.inputs, fee: tx.fee, change: tx.change, total: tx.total };
    },
    onTick(part) {
      document.querySelectorAll("[data-seg]").forEach((el) => el.classList.toggle("on", Number(el.dataset.seg) === part));
    },
  });
})();
</script>
</body>
</html>
