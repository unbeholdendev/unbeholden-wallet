:root {
  --paper: #FCFCFA; --ink: #141414; --ink-2: #4A4945; --ink-3: #6C6A64;
  --rule: #141414; --rule-2: #D6D3CA; --fill: #F2F1EC; --fill-2: #E7E5DE;
  --rubric: #B0241B; --rubric-fill: #F8E7E4; --on-ink: #FCFCFA;
  --ground: #E9E7E1; --input: #8C897F; --vf: #151515;
  --serif: "Source Serif 4 Variable", "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --t-xs: 12px; --t-sm: 13.5px; --t-base: 15px; --t-md: 17px; --t-lg: 21px; --t-xl: 28px; --t-2xl: 40px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B1916; --ink: #ECE7DE; --ink-2: #BFB8AB; --ink-3: #9A9385;
    --rule: #ECE7DE; --rule-2: #3B3732; --fill: #24211D; --fill-2: #302C27;
    --rubric: #F07A6C; --rubric-fill: #3A201C; --on-ink: #1B1916;
    --ground: #11100E; --input: #6F695F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B1916; --ink: #ECE7DE; --ink-2: #BFB8AB; --ink-3: #9A9385;
  --rule: #ECE7DE; --rule-2: #3B3732; --fill: #24211D; --fill-2: #302C27;
  --rubric: #F07A6C; --rubric-fill: #3A201C; --on-ink: #1B1916;
  --ground: #11100E; --input: #6F695F; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--ink);
  font: 400 var(--t-base)/1.45 var(--serif);
  font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--ink); color: var(--paper); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
* { scrollbar-color: var(--rule-2) transparent; scrollbar-width: thin; caret-color: var(--ink); }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.defs line { stroke: var(--ink); stroke-width: 1; }
.defs circle { fill: var(--ink); }
.defs marker path { fill: var(--ink); }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* harness */
.harness { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding: 12px 24px; border-bottom: 1px solid var(--rule-2); }
.h-title { font-weight: 650; font-size: var(--t-md); margin-right: auto; }
.h-title span { font-weight: 400; color: var(--ink-2); }
.hgroup { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--ink-2); }
.hseg { display: flex; border: 1px solid var(--rule-2); border-radius: 2px; background: var(--paper); }
.hseg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; font-size: var(--t-sm); color: var(--ink-2); }
.hseg button + button { border-left: 1px solid var(--rule-2); }
.hseg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.stage { display: flex; gap: 32px; padding: 24px; align-items: flex-start; }
.phone-col { flex: none; width: 390px; }
.desk-col { flex: 1; min-width: 0; }
[data-desktop-wrap] { overflow: hidden; }
body[data-view="phone"] .desk-col, body[data-view="desktop"] .phone-col { display: none; }
.frame-label { font-size: var(--t-xs); color: var(--ink-3); margin-top: 8px; }
.frame { background: var(--paper); border: 1px solid var(--rule-2); overflow: hidden; container-type: inline-size; }
.frame.phone { width: 390px; height: 844px; border-radius: 22px; }
.frame.desktop { width: 1280px; height: 800px; border-radius: 4px; transform: scale(var(--scale, 1)); transform-origin: 0 0; }
.scroll { height: 100%; overflow: auto; overscroll-behavior: contain; }
[data-screen-root] { min-height: 100%; display: flex; flex-direction: column; }
@media (max-width: 960px) { .stage { flex-direction: column; } }
@media (max-width: 520px) {
  .stage { padding: 0; }
  .harness { padding: 10px 16px; gap: 8px 16px; }
  body[data-view="phone"] .phone-col, .phone-col { width: 100%; }
  .frame.phone { width: 100%; height: auto; border: 0; border-radius: 0; overflow: visible; }
  .frame.phone .scroll { height: auto; overflow: visible; }
  .frame-label { display: none; }
}

/* shared type */
.amt { white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.amt .lead { color: var(--ink-3); }
.unit { font-variant-caps: all-small-caps; letter-spacing: .02em; color: var(--ink-2); }
.amt .g { display: inline-block; width: .24em; }
.num { text-align: right; white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.mono { font-family: var(--mono); font-size: .88em; letter-spacing: 0; }
.meta { font-size: var(--t-sm); color: var(--ink-2); }
.hint { font-size: var(--t-sm); color: var(--ink-3); margin-top: 6px; }
.rub { color: var(--rubric); }
h1 { font-size: var(--t-xl); line-height: 1.15; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: var(--t-md); font-weight: 650; line-height: 1.3; }
.abstract { max-width: 62ch; }
.abstract b { font-weight: 650; }

/* controls */

  // parts lets a variant dim the leading zeros.
  function btcParts(sats) {
    const neg = sats < 0;
    const s = Math.abs(sats);
    const whole = Math.floor(s / 1e8).toLocaleString("en-GB");
    const frac = String(s % 1e8).padStart(8, "0");
    const grouped = frac.slice(0, 2) + " " + frac.slice(2, 5) + " " + frac.slice(5);
    const full = whole + "." + grouped;
    let i = 0;
    while (i < full.length && /[0. ]/.test(full[i])) i++;
    if (i > 0 && full[i - 1] === ".") i--;
    return { sign: neg ? "−" : "", lead: full.slice(0, i), rest: full.slice(i) || "0", full };

    const feeNo = Math.ceil(vbNoChange * state.feeRate);
    const feeCh = Math.ceil(vbChange * state.feeRate);
    let change = inputs - sending - feeCh;
    let fee = feeCh, vbytes = vbChange;
    if (change < 546) { change = 0; fee = inputs - sending; vbytes = vbNoChange; }

    }

      else if (rate < b.to) ahead += b.mvb * (b.to - rate) / (b.to - b.from);

    check: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>',
    chev: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>',
    cam: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5h2.5l1.2-2h4.6l1.2 2H14v7.5H2z"/><circle cx="8" cy="9" r="2.3"/></svg>',
    file: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.8h5l3 3V14H4z"/><path d="M9 1.8V5h3"/></svg>',
    minus: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg>',
    plus: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg>',
    ext: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5L7 9M11.5 9.5v4h-9v-9h4"/></svg>',
  };
  const wallet = () => P.wallets.find((w) => w.id === S.wallet);
  const plural = (n, a, b) => n === 1 ? a : b;
  function when(rate) {
    const b = P.blocksFor(rate), m = b * 10;
    const t = m < 60 ? `${m} minutes` : (m % 60 === 0 && m / 60 === 1 ? "1 hour" : `${(m / 60).toFixed(m % 60 ? 1 : 0)} hours`);
    return `about ${b} ${plural(b, "block", "blocks")}, ${t}`;
  }

  /* shells */
  function shell(kind, active, main, foot = "") {
    if (kind === "desktop") return `<div class="app-d"><aside class="side">${side(active)}</aside><main class="main-d">${main}</main></div>`;
    return `<div class="app-p"><div class="topbar">${top()}</div><main class="main-p">${main}</main><div class="foot">${foot}<nav class="tabs" aria-label="Sections">
      <button data-goto="home">Overview</button><button data-goto="send">Send</button><button data-goto="sign">Sign</button><button data-goto="connect">Server</button></nav></div></div>`;
  }
  function side(active) {
    const items = [["home", "Overview"], [null, "Coins", "10"], ["send", "Send"], [null, "Receive"], [null, "Addresses", "38"], [null, "Labels"], ["sign", "Signing", "1"], ["connect", "Server"]];
    return `<p class="brand">btc-browser-wallet</p>
      <section><h2 class="side-h">Wallets</h2><ul>${P.wallets.map((w) => `<li><button class="wal" data-act="wallet" data-v="${w.id}" aria-current="${w.id === S.wallet}"><span class="wal-name">${esc(w.name)}</span><span class="wal-meta">${w.kind}, ${w.network}</span></button></li>`).join("")}</ul></section>
      <nav class="toc" aria-label="Contents"><h2 class="side-h">Contents</h2><ol>${items.map(([g, l, n]) => `<li><button type="button" ${g ? `data-goto="${g}"` : ""}>${l}${n ? `<span class="pg">${n}</span>` : ""}</button></li>`).join("")}</ol></nav>
      <div class="side-status"><p><span class="dot"></span>Connected to ${SERVER}</p><p class="meta">Block 973 412, synced ${P.timeOf(P.NOW.toISOString())}</p><p class="actions"><button class="btn-text">Lock</button></p><p class="meta">Version 0.1.0, build 4f98e2f</p></div>`;
  }
  function top() {
    return `<div class="tb"><label class="wsel"><span class="sr">Wallet</span><select data-wallet-select>${P.wallets.map((w) => `<option value="${w.id}" ${w.id === S.wallet ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select>${ic.chev}</label><button class="btn-text">Lock</button></div>
      <p class="tb-status"><span class="dot"></span>Connected, block 973 412, ${wallet().kind} ${wallet().network}</p>`;
  }

  /* connect */
  function connect(kind) {
    const host = S.server.replace(/^wss?:\/\//, "");
    let body = "";
    if (S.connection === "connecting") {
      body = `<p class="meta"><span class="spin" aria-hidden="true"></span>Opening a secure WebSocket to ${esc(host)}. Waiting up to 10 seconds for an answer.</p>
        <div class="actions"><button class="btn-pri" disabled>Connecting</button><button class="btn-text">Cancel</button></div>`;
    } else if (S.connection === "cert") {
      body = `<div class="err" role="alert">
        <p><b class="rub">Certificate rejected.</b> Your server at ${esc(host)} did not finish a secure connection. The browser refused its certificate, most likely because it is self-signed, and browsers give WebSockets no way to accept one.</p>
        <h2>To fix it</h2>
        <ol class="fix">
          <li><p>Open <a class="mono" href="#">https://${esc(host)}</a> in a new tab.</p><button class="btn-sec">${ic.ext}Open in new tab</button></li>
          <li><p>The browser warns that the certificate is not trusted. Check it is your server's certificate, then choose to proceed. You may then see an error or a blank page. That is expected: the browser now trusts the certificate.</p></li>
          <li><p>Come back to this tab and try again.</p></li>
        </ol>
        <div class="actions"><button class="btn-pri" data-act="conn" data-v="connecting">Try again</button><button class="btn-text" data-act="conn" data-v="idle">Edit address</button></div>
        <p class="meta"><b>To avoid this every time,</b> give your node a valid certificate with Tailscale (see <a href="#">Reaching your node with Tailscale</a>), or run this app from the local container at http://localhost, which can use ws:// on your own network.</p>
        <p class="meta">Details: the connection closed with code 1006 before opening, 0.4 seconds after it started. A rejected certificate is the only cause that fits.</p>
      </div>`;
    } else {
      body = `<div class="actions"><button class="btn-pri" data-act="conn" data-v="connecting">Connect</button></div>`;
    }
    return `<div class="conn"><header class="conn-top"><b>btc-browser-wallet</b><span class="meta">Version 0.1.0</span></header>
      <main class="conn-main">
        <div class="conn-title"><h1>Connect to your Electrum server</h1>
          <p class="abstract"><b>Abstract.</b> This wallet reads the chain only through a server you run, such as Fulcrum or electrs. There is no default server, and it never falls back to someone else's.</p></div>
        <form class="conn-form" onsubmit="return false">
          <div><label for="srv-${kind}">Server address</label><input id="srv-${kind}" class="inp mono" value="${esc(S.server)}" spellcheck="false" autocomplete="off"${S.connection === "cert" ? ' aria-invalid="true"' : ""}>
          <p class="hint">Use wss:// on this hosted page. Plain ws:// only works when the app runs on localhost.</p></div>
          ${body}
        </form>
        <section class="recent"><h2 class="lbl">Used before</h2><ul><li><button class="rec"><span class="mono">wss://${SERVER}:50004</span><span class="meta">Last connected 3 Oct 2026</span></button></li></ul></section>
        <p class="trust">This page is served by a host you have to trust. It never sees your keys, but a tampered copy could show you a wrong address. Version 0.1.0 matches the published build hash 3f9a…c21e.</p>
      </main></div>`;
  }

  /* home */
  function home(kind) {
    const b = P.balances();
    const w = wallet();
    const head = `<header class="page-h"><h1>${esc(w.name)}</h1><p class="meta">${w.kind} descriptor, ${w.network}, fingerprint 7c3a91f0</p></header>
      <section class="home-top">
        <div><p class="bal-l">Confirmed</p><p class="bal-v">${amt(b.confirmed)}</p>
          <dl class="bal-sub"><div><dt>Unconfirmed</dt><dd>${amt(b.unconfirmed, { plus: true })}</dd></div><div><dt>Frozen, not counted</dt><dd>${amt(b.frozen)}</dd></div></dl></div>
        <div><p class="abstract"><b>Status.</b> Synced to block 973 412 at ${P.timeOf(P.NOW.toISOString())}. Watching 27 receive and 11 change addresses. New payments appear here as they arrive.</p></div>
      </section>
      <div class="note"><p><b>Rent, October</b> has waited 49 minutes at 6 sat/vB. About 8 blocks of transactions pay more than it does.</p><button class="btn-sec">Bump fee</button></div>`;
    const conf = (t) => t.height == null ? "Unconfirmed" : P.sats(P.confs(t.height));
    const note = (t) => t.height != null ? "" : t.amount < 0 ? `<span class="t-note">Waiting for a block. You can still raise the fee.</span>` : `<span class="t-note rub">From someone else, unconfirmed. They can still replace it.</span>`;
    let list;
    if (kind === "desktop") {
      list = `<table class="bt tx"><thead><tr><th>Date</th><th>Label</th><th class="num">Confirmations</th><th class="num">Amount</th></tr></thead><tbody>
        ${P.history.map((t) => `<tr><td>${P.dateOf(t.time)}<span class="t-sub">${P.timeOf(t.time)}</span></td><td>${esc(t.label)}${note(t)}</td><td class="num">${conf(t)}</td><td class="num">${amt(t.amount, { plus: true, unit: false })}</td></tr>`).join("")}
        </tbody></table>`;
    } else {
      list = `<div class="txp-wrap"><ul class="txp">${P.history.map((t) => `<li><span>${esc(t.label)}</span><span class="num">${amt(t.amount, { plus: true, unit: false })}</span><span class="t-sub">${P.dateOf(t.time)}, ${P.timeOf(t.time)}</span><span class="t-sub num">${t.height == null ? "Unconfirmed" : conf(t) + " conf."}</span>${note(t)}</li>`).join("")}</ul></div>`;
    }
    return shell(kind, "home", `${head}
      <section><div class="sec-h"><h2>Transactions</h2><input class="inp filter" placeholder="Filter by label, amount or date" aria-label="Filter transactions"></div>
      <p class="selnote">Newest first. Amounts in <span class="unit">BTC</span>.</p>${list}</section>`);
  }

  /* send */
  function groups() {
    return P.sourceOrder.map((id) => ({ id, ...P.sources[id], coins: P.coins.filter((c) => c.source === id).sort((a, b) => b.value - a.value) })).filter((g) => g.coins.length);
  }
  function coinNote(c) {
    if (c.frozen) return `<span class="c-note">Frozen. Never selected, not counted in balances.</span>`;
    if (c.status === "own-change") return `<span class="c-note">Your own change, unconfirmed. Safe to spend.</span>`;
    if (c.status === "foreign-unconfirmed") return `<span class="c-note rub">Unconfirmed payment from someone else. They can still replace it.</span>`;
    return "";
  }
  const confTxt = (c) => c.height == null ? "0" : P.sats(P.confs(c.height));
  function coinsDesktop() {
    return `<table class="bt coins"><thead><tr><th class="cb"><span class="sr">Select</span></th><th>Coin</th><th class="num">Age</th><th class="num">Conf.</th><th class="num">Value</th></tr></thead>
      ${groups().map((g) => {
        const tot = g.coins.reduce((a, c) => a + c.value, 0);
        return `<tbody><tr class="grp-h"><th colspan="5" scope="colgroup"><div class="grp-line"><span class="grp-name">${sw(g.id)}<b>${esc(g.name)}</b><span class="grp-note">${esc(g.note)}</span></span><span class="grp-tot">${amt(tot, { unit: false })}</span></div></th></tr>
        ${g.coins.map((c) => {
          const sel = S.selected.has(c.id), ok = P.spendable(c);
          return `<tr class="coin${sel ? " is-sel" : ""}${ok ? "" : " is-off"}" data-act="coin" data-v="${c.id}"><td class="cb"><input type="checkbox" ${sel ? "checked" : ""} ${ok ? "" : "disabled"} aria-label="Spend ${esc(c.label)}"></td>
            <td><span class="c-label">${esc(c.label)}</span><span class="c-addr">${P.short(c.address, 10, 6)}</span>${coinNote(c)}</td>
            <td class="num">${P.ageOf(c)}</td><td class="num">${confTxt(c)}</td><td class="num val">${amt(c.value, { unit: false })}</td></tr>`;
        }).join("")}</tbody>`;
      }).join("")}</table>`;
  }
  function coinsPhone() {
    return `<div class="coinlist-wrap"><div class="coinlist">${groups().map((g) => `<div class="grp-p"><span class="grp-name">${sw(g.id)}<span><b>${esc(g.name)}</b><span class="grp-note">${esc(g.note)}</span></span></span></div>
      ${g.coins.map((c) => {
        const sel = S.selected.has(c.id), ok = P.spendable(c);
        return `<div class="coin-p${sel ? " is-sel" : ""}${ok ? "" : " is-off"}" data-act="coin" data-v="${c.id}"><input type="checkbox" ${sel ? "checked" : ""} ${ok ? "" : "disabled"} aria-label="Spend ${esc(c.label)}">
          <span><span class="c-label">${esc(c.label)}</span><span class="cp-meta">${P.ageOf(c)}, ${confTxt(c)} conf.</span>${coinNote(c)}</span><span class="val">${amt(c.value, { unit: false })}</span></div>`;
      }).join("")}`).join("")}</div></div>`;
  }

  // Fewest sources that cover the payment, preferring sources that already share an owner-knowledge class.
  function bestSet() {
    const t = P.txSummary();
    const need = t.sending + Math.ceil((10.5 + 68 * 4 + 62) * S.feeRate);
    const ids = P.sourceOrder.filter((id) => id !== "dust" && id !== "meridian");
    const pool = (id) => P.coins.filter((c) => c.source === id && P.spendable(c));
    const sum = (cs) => cs.reduce((a, c) => a + c.value, 0);
    const sets = [];
    ids.forEach((a, i) => { sets.push([a]); ids.slice(i + 1).forEach((b) => sets.push([a, b])); });
    const ok = sets.filter((s) => sum(s.flatMap(pool)) >= need);
    if (!ok.length) return null;
    const mixed = (s) => new Set(s.map((id) => P.sources[id].kyc)).size > 1 ? 1 : 0;
    ok.sort((x, y) => x.length - y.length || mixed(x) - mixed(y) || sum(x.flatMap(pool)) - sum(y.flatMap(pool)));
    const best = ok[0];
    return { ids: best, coins: best.flatMap(pool), total: sum(best.flatMap(pool)), mixed: mixed(best) };
  }

  function figPrivacy(kind) {
    const pv = P.privacy(), t = P.txSummary();
    if (!t.sel.length) return `<figure class="fig" id="fig1-${kind}"><div class="fig-empty">Select coins to see what this transaction links.</div><figcaption><b>Figure 1.</b> Nothing selected yet.</figcaption></figure>`;
    const n = pv.linked.length;
    let y = 4; const rows = [], boxes = [];
    for (const g of pv.linked) {
      const gy = y; y += 20;
      for (const c of g.coins) { rows.push({ c, y: y + 8 }); y += 20; }
      y += 4; boxes.push({ g, y: gy, h: y - gy }); y += 10;
    }
    const outs = [...S.recipients.map((r) => ({ name: "Pays", v: r.amount })), ...(t.change > 0 ? [{ name: "Change", v: t.change }] : [])];
    const H = Math.max(y, 140), cy = H / 2, tx = 196, tw = 84, th = 52;
    const svg = [];
    for (const b of boxes) {
      svg.push(`<rect class="gbox" x="0" y="${b.y}" width="156" height="${b.h}"/>`);
      svg.push(`<rect class="hs" x="7" y="${b.y + 6}" width="10" height="10" fill="url(#h-${b.g.id})"/><text x="23" y="${b.y + 15}" font-weight="600">${esc(b.g.short)}</text>`);
    }
    for (const r of rows) {
      svg.push(`<text x="23" y="${r.y + 4}">${P.btc(r.c.value)}</text>`);
      svg.push(`<path class="ln" d="M156 ${r.y} C 178 ${r.y}, 176 ${cy}, ${tx} ${cy}" marker-end="url(#arr)"/>`);
    }
    svg.push(`<rect class="txb${n > 1 ? " link" : ""}" x="${tx}" y="${cy - th / 2}" width="${tw}" height="${th}"/>`);
    svg.push(`<text x="${tx + tw / 2}" y="${cy - 6}" text-anchor="middle" font-weight="600">Transaction</text><text class="s" x="${tx + tw / 2}" y="${cy + 10}" text-anchor="middle">${t.sel.length} in, ${outs.length} out</text>`);
    if (n > 1) svg.push(`<text class="rubt" x="${tx + tw / 2}" y="${cy + th / 2 + 16}" text-anchor="middle">links ${n} sources</text>`);
    const oy0 = cy - (outs.length - 1) * 23;
    outs.forEach((o, i) => {
      const oy = oy0 + i * 46;
      svg.push(`<path class="ln" d="M${tx + tw} ${cy} C ${tx + tw + 18} ${cy}, ${tx + tw + 16} ${oy}, 306 ${oy}" marker-end="url(#arr)"/>`);
      svg.push(`<rect class="ob" x="308" y="${oy - 17}" width="92" height="34"/><text class="s" x="314" y="${oy - 3}">${o.name}</text><text x="314" y="${oy + 11}">${P.btc(o.v)}</text>`);
    });
    const names = pv.linked.map((g) => g.name);
    let cap;
    if (n === 1) cap = `<b>Figure 1.</b> All ${t.sel.length} ${plural(t.sel.length, "input comes", "inputs come")} from one source, ${esc(names[0])}. This transaction links nothing new.`;
    else cap = `<b>Figure 1.</b> This spends coins from ${n} separate sources, permanently linking them: ${esc(listJoin(names))}. Anyone reading the chain can assume one person owns all of them.`;
    const notes = [];
    if (pv.kyc.length && pv.nonKyc.length) {
      const k = pv.kyc.map((s) => who[s.id]);
      notes.push(`<p><b class="rub">Privacy.</b> ${esc(listJoin(k))} ${plural(k.length, "knows", "know")} who you are. After this, ${plural(k.length, "it", "they")} can tie ${esc(listJoin(pv.nonKyc.map((s) => who[s.id])))} to you as well.</p>`);
    }
    if (pv.foreign.length) notes.push(`<p><b class="rub">Unconfirmed input.</b> ${esc(pv.foreign[0].label)} is not confirmed. If the sender replaces it, this transaction becomes invalid.</p>`);
    const best = bestSet();
    if (n > 1 && best && (best.ids.length < n || (pv.kyc.length && pv.nonKyc.length && !best.mixed))) {
      const bn = best.ids.map((id) => P.sources[id].name);
      const why = best.ids.length === 1 ? "and links nothing new" : !best.mixed && P.sources[best.ids[0]].kyc ? `and both already know who you are` : `and links ${best.ids.length} sources instead of ${n}`;
      notes.push(`<div class="fig-alt"><p>${esc(listJoin(bn))} ${plural(best.ids.length, "covers", "together cover")} this payment, ${why}.</p><button class="btn-text" data-my="pick" data-ids="${best.coins.map((c) => c.id).join(",")}">Use only those coins</button></div>`);
    }
    return `<figure class="fig" id="fig1-${kind}"><svg class="d" viewBox="0 0 400 ${H + (n > 1 ? 8 : 0)}" role="img" aria-label="Diagram of selected coins grouped by source, flowing into one transaction">${svg.join("")}</svg>
      <figcaption>${cap}</figcaption>${notes.length ? `<div class="fig-notes">${notes.join("")}</div>` : ""}</figure>`;
  }

  function figMempool() {
    const W = 400, max = 12, px = W / max, svg = [];
    let x = 0, cum = 0;
    P.mempool.forEach((b, i) => {
      if (cum >= max) return;
      const w = Math.min(b.mvb, max - cum) * px;
      svg.push(`<rect class="b${i}" x="${x}" y="20" width="${w}" height="34"/>`);
      if (w > 26) svg.push(`<text class="s" x="${x + w / 2}" y="13" text-anchor="middle">${b.from}${b.to < 200 ? "–" + b.to : "+"}</text>`);
      x += w; cum += b.mvb;
    });
    for (let i = 0; i <= max; i++) svg.push(`<line class="tick" x1="${i * px}" y1="54" x2="${i * px}" y2="${i % 2 ? 58 : 61}"/>` + (i % 2 === 0 ? `<text class="s" x="${i * px}" y="73" text-anchor="${i === 0 ? "start" : i === max ? "end" : "middle"}">${i}</text>` : ""));
    svg.push(`<line class="ax" x1="0" y1="54" x2="${W}" y2="54"/>`);
    const ahead = P.aheadOf(S.feeRate), mx = Math.min(ahead, max) * px;
    svg.push(`<line class="mk" x1="${mx}" y1="16" x2="${mx}" y2="58"/><path class="mkh" d="M${mx - 5} 84 L${mx} 78 L${mx + 5} 84z"/><text x="${Math.min(Math.max(mx, 30), W - 30)}" y="97" text-anchor="middle" font-weight="600">you, ${S.feeRate} sat/vB</text>`);
    const total = P.mempool.reduce((a, b) => a + b.mvb, 0);
    const b = P.blocksFor(S.feeRate);
    return `<figure class="fig"><svg class="d" viewBox="0 -2 ${W} 102" role="img" aria-label="Mempool by fee rate">${svg.join("")}</svg>
      <figcaption><b>Figure 2.</b> Your node's mempool, highest fee rate first, in millions of virtual bytes (one block is about 1). The first ${max} of ${total.toFixed(1)} MvB are shown. At ${S.feeRate} sat/vB about ${ahead.toFixed(1)} MvB pays more than you: roughly ${b} ${plural(b, "block", "blocks")}, if nothing higher arrives.</figcaption></figure>`;
  }

  function recipient(kind) {
    const r = S.recipients[0];
    return `<section class="rcp"><h2>Pay to</h2>
      <div><label for="addr-${kind}">Address</label><div class="inrow"><input id="addr-${kind}" class="inp mono" value="${r.address}" spellcheck="false"><button class="btn-sec sq" aria-label="Scan a QR code">${ic.cam}</button></div>
        <p class="ok-line">${ic.check}Valid mainnet address. Not one of yours.</p></div>
      <div><label for="amt-${kind}">Amount</label><div class="inrow"><input id="amt-${kind}" class="inp" data-amount-input inputmode="decimal" value="${P.btc(r.amount)}"><span class="suffix">btc</span></div>
        <p class="hint"><button class="btn-text" data-my="sendall">Send everything selected</button></p></div>
      <div><label for="lbl-${kind}">Label</label><input id="lbl-${kind}" class="inp" value="${esc(r.label)}"></div>
      <p><button class="btn-text">Add another recipient</button></p></section>`;
  }
  function feeSec(kind) {
    return `<section class="fee"><h2>Fee rate</h2>
      <div class="presets" role="radiogroup" aria-label="Fee rate">${P.feePresets.map((p) => `<button role="radio" aria-checked="${S.feeRate === p.rate}" data-act="fee" data-v="${p.rate}"><span class="pr-n">${p.name}</span><span class="pr-r">${p.rate} sat/vB</span><span class="pr-t">${when(p.rate)}</span></button>`).join("")}</div>
      <div class="manual"><div><label for="fee-${kind}">Or set your own</label><div class="stepper"><button data-act="fee-step" data-v="-1" aria-label="Lower by 1">${ic.minus}</button><input id="fee-${kind}" class="inp" data-fee-input type="number" min="1" step="0.1" value="${S.feeRate}"><button data-act="fee-step" data-v="1" aria-label="Raise by 1">${ic.plus}</button><span class="suffix">sat/vB</span></div></div></div>
      ${figMempool()}</section>`;
  }
  function totals() {
    const t = P.txSummary();
    const changeRow = t.change > 0
      ? `<tr><th>Change<span class="sub">to your address ${CHANGE_PATH}</span></th><td>${amt(t.change)}</td></tr>`
      : `<tr><th>Change<span class="sub">none, the remainder goes to the fee</span></th><td>${amt(0)}</td></tr>`;
    return `<section class="sum-sec"><h2>Summary</h2><table class="bt totals"><tbody>
      <tr><th>Sending</th><td>${amt(t.sending)}</td></tr>
      <tr><th>Fee<span class="sub">${S.feeRate} sat/vB on ${t.vbytes} vB</span></th><td>${P.sats(t.fee)} sats</td></tr>
      ${changeRow}
      <tr class="tot"><th>Leaves the wallet</th><td>${amt(t.total)}</td></tr></tbody></table>
      <p class="meta">Spends ${t.sel.length} ${plural(t.sel.length, "coin", "coins")} worth ${amt(t.inputs)}. Replaceable, so you can raise the fee later.</p>
      ${t.ok ? `<button class="btn-pri wide" data-goto="sign">Review and sign</button>` : `<p class="warn-p">${t.sel.length ? `The selected coins are ${amt(t.shortBy)} short. Add a coin or lower the amount.` : "Select at least one coin."}</p><button class="btn-pri wide" disabled>Review and sign</button>`}</section>`;
  }
  function send(kind) {
    const t = P.txSummary(), pv = P.privacy();
    const spendableCount = P.coins.filter(P.spendable).length;
    const selnote = `<p class="selnote">${t.sel.length} of ${spendableCount} spendable coins selected, ${amt(t.inputs)}.</p>`;
    const head = `<header class="page-h send-h"><div><h1>Send from ${esc(wallet().name)}</h1><p class="abstract">Choose the coins to spend. Figure 1 shows what spending them together reveals.</p></div>
      <div class="actions"><button class="btn-sec" data-act="auto">Select automatically</button><button class="btn-text" data-act="clear">Clear</button></div></header>`;
    if (kind === "desktop") {
      return shell(kind, "send", `${head}<div class="send-grid"><div class="col"><section>${selnote}${coinsDesktop()}</section></div>
        <div class="col">${recipient(kind)}<section class="priv-sec"><h2>What this reveals</h2>${figPrivacy(kind)}</section>${totals()}${feeSec(kind)}</div></div>`);
    }
    const n = pv.linked.length;
    const priv = !t.sel.length ? "No coins selected" : n === 1 ? "Links nothing new" : `Links ${n} sources`;
    const foot = `<div class="sendbar"><div class="sb-row"><span class="sb-sel"><b>${t.sel.length} ${plural(t.sel.length, "coin", "coins")}</b> ${amt(t.inputs)}</span><a class="sb-priv ${pv.level}" href="#fig1-phone">${priv}</a></div>
      <div class="sb-row"><span class="sb-fee">Fee ${P.sats(t.fee)} sats, change ${amt(t.change, { unit: false })}</span><button class="btn-pri" data-goto="sign" ${t.ok ? "" : "disabled"}>Review</button></div></div>`;
    return shell(kind, "send", `${head}${selnote}${coinsPhone()}<div class="gap"></div>
      <div class="col">${recipient(kind)}<section class="priv-sec"><h2>What this reveals</h2>${figPrivacy(kind)}</section>${feeSec(kind)}${totals()}</div>`, foot);
  }

  /* sign */
  function sign(kind) {
    const d = P.densities[S.density], t = P.txSummary();
    const step = (id, l) => `<li ${S.signStage === id ? 'aria-current="step"' : ""}><button data-act="stage" data-v="${id}">${l}</button></li>`;
    const steps = `<ol class="steps">${step("export", "Show to signer")}${step("scan", "Scan signed")}${step("verified", "Check and broadcast")}</ol>`;
    const sumTable = `<table class="bt totals"><tbody>
      <tr><th>Pays<span class="sub mono">${P.short(S.recipients[0].address, 10, 6)}</span></th><td>${amt(t.sending)}</td></tr>
      <tr><th>Change<span class="sub">to ${CHANGE_PATH}</span></th><td>${amt(t.change)}</td></tr>
      <tr><th>Fee<span class="sub">${S.feeRate} sat/vB</span></th><td>${P.sats(t.fee)} sats</td></tr>
      <tr><th>Inputs</th><td>${t.sel.length} coins, ${P.privacy().linked.length} sources</td></tr></tbody></table>`;
    let body;
    if (S.signStage === "scan") {
      const got = S.captured.size, miss = 40 - got;
      body = `<div class="sign-grid scan"><figure class="cam"><div class="vf"><div class="qr-in">${P.qrSvg(77, 41)}</div><span class="cn c1"></span><span class="cn c2"></span><span class="cn c3"></span><span class="cn c4"></span></div>
        <figcaption class="meta"><span>Back camera</span><button class="btn-text">Switch camera</button></figcaption></figure>
        <div class="sign-side"><h1>Scan the signed transaction</h1><p>Show the signed code on your signer and hold it up to the camera. Parts arrive in any order. Missing ones come round again on the next cycle.</p>
        <p class="count"><b>${got}</b> of 40 parts captured</p>
        <figure class="fig"><div class="parts">${Array.from({ length: 40 }, (_, i) => `<span class="pc${S.captured.has(i + 1) ? " got" : ""}">${i + 1}</span>`).join("")}</div>
        <figcaption><b>Figure 3.</b> Parts received so far, filled when captured. ${miss} still missing.</figcaption></figure>
        <div class="actions"><button class="btn-sec">${ic.file}Load signed file instead</button><button class="btn-text" data-act="stage" data-v="export">Back to the code</button></div></div></div>`;
    } else if (S.signStage === "verified") {
      const row = (h, d) => `<tr><td>${ic.check}</td><th>${h}</th><td>${d}</td></tr>`;
      body = `<div class="sign-side"><h1>Signed and checked</h1><p class="abstract">The signed transaction matches the one you built. Nothing has been sent yet.</p>
        <table class="bt checks"><tbody>
        ${row("Outputs", `2 of 2 match: ${amt(t.sending)} to <span class="mono">${P.short(S.recipients[0].address, 10, 6)}</span>, change ${amt(t.change)} to ${CHANGE_PATH}`)}
        ${row("Fee", `${P.sats(t.fee)} sats at ${S.feeRate} sat/vB, as built`)}
        ${row("Signatures", `${t.sel.length} of ${t.sel.length} inputs signed`)}
        ${row("Replaceable", "Yes, you can raise the fee while it waits")}
        </tbody></table>
        <div class="actions"><button class="btn-pri">Broadcast through ${SERVER}</button><button class="btn-sec">${ic.file}Save signed file</button></div>
        <p class="meta">Broadcasting cannot be undone. It goes only to your own server.</p></div>`;
    } else {
      body = `<div class="sign-grid"><figure class="qr-fig"><div class="qr" data-qr>${P.qrSvg(S.part, d.modules)}</div>
        <figcaption><span class="part">Part <b data-part>${S.part}</b> of ${d.parts}</span><span class="partbar" data-part-bar><i></i></span></figcaption></figure>
        <div class="sign-side"><h1>Sign on your signer</h1><p>Hold this screen up to your signer's camera. The code cycles through ${d.parts} parts and the signer collects them in any order, so it does not matter where it starts.</p>
        <div class="ctl"><p class="lbl">Frames per second</p><div class="seg" role="radiogroup" aria-label="Frames per second">${[2, 4, 6, 8].map((f) => `<button role="radio" aria-checked="${S.fps === f}" data-act="fps" data-v="${f}">${f}</button>`).join("")}</div><p class="hint">Slow it down if the signer misses frames.</p></div>
        <div class="ctl"><p class="lbl">Density</p><div class="seg" role="radiogroup" aria-label="Density">${[["low", "Low"], ["medium", "Medium"], ["high", "High"]].map(([v, l]) => `<button role="radio" aria-checked="${S.density === v}" data-act="density" data-v="${v}">${l}</button>`).join("")}</div><p class="hint">Low density draws bigger squares over more parts. Try it if the signer struggles to focus.</p></div>
        ${sumTable}
        <div class="actions"><button class="btn-pri" data-act="stage" data-v="scan">Next: scan the signed code</button><button class="btn-sec">${ic.file}Save PSBT file</button></div></div></div>`;
    }
    return shell(kind, "sign", `<header class="page-h"><p class="meta">Signing: ${esc(S.recipients[0].label)}</p></header>${steps}${body}`);
  }

  function render(screen, kind) {
    if (screen === "connect") return connect(kind);
    if (screen === "home") return home(kind);
    if (screen === "sign") return sign(kind);
    return send(kind);
  }
  function after() {
    const total = P.densities[S.density].parts;
    document.querySelectorAll("[data-part-bar]").forEach((el) => el.style.setProperty("--p", S.part / total));
    const ex = document.querySelector("[data-extra]");
    const btn = (act, v, l, cur) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`;
    if (S.screen === "connect") ex.innerHTML = `<span>State</span><div class="hseg">${btn("conn", "idle", "Ready", S.connection)}${btn("conn", "connecting", "Connecting", S.connection)}${btn("conn", "cert", "Certificate rejected", S.connection)}</div>`;
    else if (S.screen === "sign") ex.innerHTML = `<span>Stage</span><div class="hseg">${btn("stage", "export", "Export", S.signStage)}${btn("stage", "scan", "Scan back", S.signStage)}${btn("stage", "verified", "Verified", S.signStage)}</div>`;
    else ex.innerHTML = "";
    const wrap = document.querySelector("[data-desktop-wrap]");
    const sc = parseFloat(wrap.style.getPropertyValue("--scale")) || 1;
    document.querySelector("[data-desk-label]").textContent = `Desktop, 1280 by 800${sc < 1 ? `, shown at ${Math.round(sc * 100)}%` : ""}`;
  }

  document.addEventListener("click", (e) => {
    const m = e.target.closest("[data-my]");
    if (!m) return;
    if (m.dataset.my === "pick") S.selected = new Set(m.dataset.ids.split(","));
    if (m.dataset.my === "sendall") {
      const n = S.selected.size, ins = [...S.selected].reduce((a, id) => a + P.coinById(id).value, 0);
      S.recipients[0].amount = ins - Math.ceil((10.5 + 68 * n + 31) * S.feeRate);
    }
    P.rerender();
  });
  document.addEventListener("change", (e) => {
    if (e.target.matches("[data-wallet-select]")) { S.wallet = e.target.value; P.rerender(); }
    if (e.target.matches("[data-amount-input]")) {
      const v = Math.round(parseFloat(e.target.value.replace(/[\s ,]/g, "")) * 1e8);
      if (v > 0) { S.recipients[0].amount = v; P.rerender(); }
    }
  });

  P.mount({ render, after });
})();
</script>
</body>
</html>
