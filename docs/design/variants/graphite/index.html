  --accent: #7aa2ff;
  --accent-ink: #0b1430;
  --accent-soft: #1d2a47;
  --ok: #4cc38a;
  --warn: #ffb454;
  --warn-soft: #3a2c17;
  --danger: #ff6b6b;
  --danger-soft: #3d1d1f;
  --l-kraken: #e6db74;
  --l-ocean: #66d9ef;
  --l-bisq: #a8d86b;
  --l-payroll: #c3a6ff;
  --l-tom: #ff7ab8;
  --l-meridian: #ff9070;
  --l-dust: #8b949e;
  --plate: #ffffff;
  --plate-ink: #101214;
  --sel: #22304f;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e9ecef;
  --panel: #f7f8f9;
  --raised: #ffffff;
  --sunk: #e2e6ea;
  --seam: #d3d8de;
  --seam-strong: #b5bcc5;
  --text: #15181c;
  --text-2: #48515b;
  --text-3: #5e6772;
  --accent: #2f5fd0;
  --accent-ink: #ffffff;
  --accent-soft: #dfe7fa;
  --ok: #1d8a55;
  --warn: #9a5a00;
  --warn-soft: #fbefd9;
  --danger: #c62828;
  --danger-soft: #fbe3e3;
  --l-kraken: #8f7400;
  --l-ocean: #0b7a90;
  --l-bisq: #4d7b10;
  --l-payroll: #6c4ac2;
  --l-tom: #bf2e6d;
  --l-meridian: #c2461d;
  --l-dust: #6b737c;
  --sel: #dde6f8;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Recursive Variable", ui-sans-serif, system-ui, sans-serif;
  font-variation-settings: "MONO" 0, "CASL" 0;
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; font-variation-settings: inherit; }
input { font: inherit; color: inherit; }
* { scrollbar-width: thin; scrollbar-color: var(--seam-strong) transparent; }

.amt { white-space: nowrap; }
.mono, .amt, .num { font-variation-settings: "MONO" 1, "CASL" 0; font-variant-numeric: tabular-nums; }
.amt .ld { color: var(--text-3); }
.amt .u { color: var(--text-3); font-size: 0.85em; margin-left: 0.35em; font-variation-settings: "MONO" 0; }
.cap { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); }

/* Prototype chrome, outside the app frames */
.proto { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--seam); background: var(--panel); }
.proto h1 { margin: 0; font-size: 15px; font-weight: 750; }
.proto p { margin: 0; color: var(--text-2); max-width: 60ch; }
.proto .grow { flex: 1 1 320px; }
.seg { display: inline-flex; border: 1px solid var(--seam-strong); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--seam-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 650; }
.seg button:hover { color: var(--text); }
.states { display: flex; gap: 8px; align-items: center; }
.states .lbl { color: var(--text-3); }

.stage { display: flex; gap: 32px; padding: 24px; align-items: flex-start; }
.phone-col { flex: 0 0 390px; }
.desk-col { flex: 1 1 auto; min-width: 0; }
body[data-view="phone"] .desk-col, body[data-view="desktop"] .phone-col { display: none; }
body[data-view="phone"] .stage { justify-content: center; }
.device { width: 390px; height: 844px; border: 1px solid var(--seam-strong); border-radius: 22px; overflow: hidden; background: var(--bg); }
.desk-wrap { width: 100%; position: relative; overflow: hidden; }
.desk { width: 1280px; height: 800px; transform: scale(var(--scale, 1)); transform-origin: 0 0; border: 1px solid var(--seam-strong); border-radius: 8px; overflow: hidden; background: var(--bg); }
.caption { margin: 8px 2px 0; color: var(--text-3); font-size: 12px; }
.app-root { height: 100%; container: app / inline-size; }
@media (max-width: 520px) {
  .proto { padding: 12px 16px; }
  .stage { padding: 0; }
  .phone-col { flex-basis: 100%; }
  .device { width: 100%; border: 0; border-radius: 0; height: 844px; }
  .caption { display: none; }
}

/* App shell */
.app { height: 100%; display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; background: var(--bg); }
.rail { display: none; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--seam); background: var(--panel); min-height: 52px; }
.wsw { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--seam-strong); border-radius: 4px; background: var(--raised); cursor: pointer; font-weight: 650; min-height: 36px; }
.wsw svg { color: var(--text-3); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--seam-strong); font-size: 11px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.chip.danger { border-color: var(--danger); color: var(--danger); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.reg { border-color: var(--l-payroll); color: var(--l-payroll); }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); margin-left: auto; font-size: 12px; min-width: 0; }
.status .host { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--warn); }
.dot.danger { background: var(--danger); }
.iconbtn { border: 1px solid transparent; background: transparent; border-radius: 4px; width: 36px; height: 36px; display: inline-grid; place-items: center; color: var(--text-2); cursor: pointer; }
.iconbtn:hover { border-color: var(--seam-strong); color: var(--text); }
.main { min-height: 0; overflow: auto; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--seam); background: var(--panel); }
.tabs button { border: 0; background: transparent; padding: 8px 0 10px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--text-3); cursor: pointer; }
.tabs button.on { color: var(--text); font-weight: 650; }
.tabs button.on svg { color: var(--accent); }

@container app (min-width: 900px) {
  .app { grid-template-columns: 56px 1fr; grid-template-rows: auto 1fr; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; grid-row: 1 / span 2; border-right: 1px solid var(--seam); background: var(--panel); }
  .rail .iconbtn { width: 40px; height: 40px; }
  .rail .iconbtn.on { color: var(--accent); background: var(--accent-soft); }
  .rail .spacer { flex: 1; }
  .tabs { display: none; }
  .top { padding: 8px 20px; }
}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--seam-strong); background: var(--raised); color: var(--text); font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 120ms ease-out, border-color 120ms ease-out; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary[aria-disabled="true"] { background: var(--raised); border-color: var(--seam); color: var(--text-3); cursor: not-allowed; filter: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { color: var(--text); border-color: var(--seam-strong); }
.btn.destructive { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; }
.btn.block { width: 100%; }
.btn svg { flex: none; }

/* Panels */
.panel { background: var(--panel); }
.ph { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--seam); min-height: 44px; }
.ph .cap { margin-right: auto; }
.pb { padding: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.input { display: flex; align-items: center; border: 1px solid var(--seam-strong); border-radius: 4px; background: var(--sunk); min-height: 40px; padding: 0 10px; gap: 8px; }
.input input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; padding: 8px 0; }
.input:focus-within { border-color: var(--accent); }
.hint { color: var(--text-3); font-size: 12px; }
.rows { display: grid; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--seam); align-items: baseline; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--text-2); }
.kv .v { text-align: right; }
.kv .v small { display: block; color: var(--text-3); font-size: 11px; }
.kv.total { font-weight: 750; }
.kv.total .k { color: var(--text); }

/* Connect */
.connect { display: grid; gap: 0; min-height: 100%; align-content: start; }
.connect .intro { padding: 24px 16px 8px; }
.connect h2 { margin: 0 0 6px; font-size: 20px; font-weight: 750; letter-spacing: -0.01em; text-wrap: balance; }
.connect .intro p { margin: 0; color: var(--text-2); max-width: 52ch; }
.form { display: grid; gap: 14px; padding: 16px; }
.form .row { display: flex; gap: 8px; }
.form .row .input { flex: 1; }
.recent { display: flex; gap: 8px; align-items: center; color: var(--text-3); font-size: 12px; flex-wrap: wrap; }
.recent button { border: 1px dashed var(--seam-strong); background: transparent; border-radius: 4px; padding: 2px 8px; cursor: pointer; color: var(--text-2); }
.err { margin: 0 16px 16px; border: 1px solid var(--danger); border-radius: 6px; background: var(--danger-soft); }
.err .eh { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px 10px; }
.err .eh svg { color: var(--danger); flex: none; margin-top: 2px; }
.err h3 { margin: 0; font-size: 15px; font-weight: 750; }
.err .eh p { margin: 4px 0 0; color: var(--text-2); max-width: 60ch; }
.steps { list-style: none; margin: 0; padding: 4px 16px 4px; display: grid; gap: 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
.steps li::before { content: counter(s); font-variation-settings: "MONO" 1; font-weight: 700; color: var(--danger); grid-row: span 2; }
.steps b { font-weight: 650; }
.steps .sub { color: var(--text-2); grid-column: 2; }
.steps code { font-variation-settings: "MONO" 1; background: var(--sunk); border: 1px solid var(--seam); border-radius: 3px; padding: 1px 5px; font-size: 12px; word-break: break-all; }
.err .acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 16px 16px; }
.alt { margin: 0 16px 16px; display: grid; gap: 0; border: 1px solid var(--seam); border-radius: 6px; }
.alt > div { padding: 12px 14px; }
.alt > div + div { border-top: 1px solid var(--seam); }
.alt b { display: block; margin-bottom: 2px; }
.alt p { margin: 0; color: var(--text-2); }
.log { margin: 0; padding: 12px 16px; font-size: 12px; color: var(--text-2); white-space: pre-wrap; line-height: 1.7; }
.log .t { color: var(--text-3); }
.log .bad { color: var(--danger); }
.log .good { color: var(--ok); }
.checklist { list-style: none; margin: 0; padding: 8px 16px; display: grid; }
.checklist li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--seam); }
.checklist li:last-child { border-bottom: 0; }
.checklist .s { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; }
.checklist .done { color: var(--ok); }
.checklist .wait { color: var(--text-3); }
.spin { width: 12px; height: 12px; border: 2px solid var(--seam-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.trust { padding: 16px; color: var(--text-3); font-size: 12px; max-width: 64ch; }
@container app (min-width: 900px) {
  .connect { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 100%; align-content: stretch; }
  .connect .left { border-right: 1px solid var(--seam); overflow: auto; }
  .connect .right { overflow: auto; background: var(--panel); }
  .connect .intro { padding: 40px 32px 8px; }
  .connect h2 { font-size: 28px; }
  .form { padding: 20px 32px; }
  .err, .alt { margin-left: 32px; margin-right: 32px; }
  .trust { padding: 16px 32px; }
}

/* Home */
.bal { display: grid; gap: 0; background: var(--panel); border-bottom: 1px solid var(--seam); }
.bal .big { padding: 18px 16px 12px; }
.bal .big .amt { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.bal .sub { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--seam); }
.bal .sub > div { padding: 10px 16px; }
.bal .sub > div + div { border-left: 1px solid var(--seam); }
.bal .sub .amt { font-size: 15px; font-weight: 600; }
.bal .note { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.sync { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--seam); color: var(--text-2); font-size: 12px; background: var(--panel); }
.sync .num { color: var(--text); }
.filter { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--seam); flex-wrap: wrap; align-items: center; }
.filter .input { flex: 1 1 200px; min-height: 34px; }
.txl { list-style: none; margin: 0; padding: 0; }
.tx { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 16px; border-bottom: 1px solid var(--seam); }
.tx .lab { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { text-align: right; font-weight: 600; }
.tx .amt.in .sg { color: var(--ok); }
.tx .meta { color: var(--text-3); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tx .right { text-align: right; font-size: 12px; color: var(--text-3); }
.tx.pending { background: color-mix(in srgb, var(--warn) 5%, transparent); }
.wallets { list-style: none; margin: 0; padding: 0; }
.wallets button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; text-align: left; cursor: pointer; }
.wallets button:hover { background: var(--raised); }
.wallets button[aria-current="true"] { background: var(--sel); }
.wallets .n { font-weight: 650; }
.wallets .d { color: var(--text-3); font-size: 12px; }
.home-side { display: none; }
.th { display: none; }
@container app (min-width: 900px) {
  .home { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  .home-side { display: block; border-right: 1px solid var(--seam); background: var(--panel); overflow: auto; }
  .home-main { overflow: auto; min-height: 0; }
  .bal .big .amt { font-size: 28px; }
  .tx { grid-template-columns: 110px minmax(0, 1fr) 150px 170px; align-items: center; padding: 9px 20px; }
  .tx .meta.m { display: none; }
  .tx .dt { color: var(--text-2); font-size: 12px; }
  .tx .right { order: 3; text-align: left; }
  .tx .amt { order: 4; }
  .th { display: grid; grid-template-columns: 110px minmax(0, 1fr) 150px 170px; gap: 12px; padding: 8px 20px; border-bottom: 1px solid var(--seam); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .th span:last-child { text-align: right; }
  .home .bal { display: none; }
  .filter { padding: 10px 20px; }
}
.home-side .bal { display: grid; border-bottom: 1px solid var(--seam); }
.home-side .bal .sub { grid-template-columns: 1fr; }
.home-side .bal .sub > div + div { border-left: 0; border-top: 1px solid var(--seam); }
@container app (max-width: 899px) { .tx .dt { display: none; } .tx .meta.m { grid-column: 1; grid-row: 2; } .tx .right { grid-column: 2; grid-row: 2; } .tx .meta .mono { display: none; } }

/* Send */
.send { height: 100%; display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.ptabs { padding: 8px 16px; border-bottom: 1px solid var(--seam); background: var(--panel); }
.ptabs .seg { width: 100%; }
.ptabs .seg button { flex: 1; padding: 8px 0; }
.ptabs .seg .n { font-variation-settings: "MONO" 1; color: var(--text-3); margin-left: 4px; }
.cols { min-height: 0; overflow: auto; }
.col { display: none; }
.col.show { display: block; }
.coinbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--seam); flex-wrap: wrap; }
.coinbar .cnt { margin-right: auto; color: var(--text-2); }
.coinbar .cnt b { color: var(--text); font-variation-settings: "MONO" 1; }
.coins { list-style: none; margin: 0; padding: 0; }
.coin { display: grid; grid-template-columns: var(--gw) 1fr auto; align-items: stretch; border: 0; border-bottom: 1px solid var(--seam); width: 100%; padding: 0; background: transparent; text-align: left; cursor: pointer; height: var(--rh); }
.coin:hover { background: var(--raised); }
.coin[aria-pressed="true"] { background: var(--sel); }
.coin[aria-disabled="true"] { cursor: not-allowed; }
.coin[aria-disabled="true"] .body { opacity: 0.6; }
.coin svg.g { display: block; height: var(--rh); width: var(--gw); }
.coin .body { display: grid; align-content: center; gap: 1px; min-width: 0; padding: 0 8px 0 4px; }
.coin .l1 { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.coin .l1 .amt { font-weight: 650; font-size: 14px; flex: none; }
.coin .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--text); }
.coin .l2 { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-3); min-width: 0; white-space: nowrap; overflow: hidden; }
.coin .src { font-weight: 650; }
.coin .tick { display: grid; place-items: center; width: 44px; }
.box { width: 18px; height: 18px; border: 1.5px solid var(--seam-strong); border-radius: 3px; display: grid; place-items: center; color: var(--accent-ink); }
.coin[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.coin[aria-disabled="true"] .box { border-style: dashed; }
.merge { display: grid; grid-template-columns: var(--gw) 1fr; align-items: center; border-bottom: 1px solid var(--seam); }
.merge svg { display: block; width: var(--gw); height: 64px; }
.merge .m { padding: 0 16px 0 4px; }
.merge .m b { display: block; font-size: 13px; }
.merge .m span { color: var(--text-3); font-size: 12px; }
.src.kraken { color: var(--l-kraken); } .src.ocean { color: var(--l-ocean); } .src.bisq { color: var(--l-bisq); } .src.payroll { color: var(--l-payroll); } .src.tom { color: var(--l-tom); } .src.meridian { color: var(--l-meridian); } .src.dust { color: var(--l-dust); }
.ln { fill: none; stroke-width: 2; stroke-linecap: round; }
.ln.dim { opacity: 0.28; }
.nd { stroke-width: 2; }
.kraken { stroke: var(--l-kraken); } .ocean { stroke: var(--l-ocean); } .bisq { stroke: var(--l-bisq); } .payroll { stroke: var(--l-payroll); } .tom { stroke: var(--l-tom); } .meridian { stroke: var(--l-meridian); } .dust { stroke: var(--l-dust); }
.nd.on.kraken { fill: var(--l-kraken); } .nd.on.ocean { fill: var(--l-ocean); } .nd.on.bisq { fill: var(--l-bisq); } .nd.on.payroll { fill: var(--l-payroll); } .nd.on.tom { fill: var(--l-tom); } .nd.on.meridian { fill: var(--l-meridian); } .nd.on.dust { fill: var(--l-dust); }
.nd.off { fill: var(--panel); }
.nd.frozen { stroke-dasharray: 2 2; fill: var(--panel); }
.trunk { stroke: var(--text); stroke-width: 2.5; fill: none; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.swatch.kraken { background: var(--l-kraken); } .swatch.ocean { background: var(--l-ocean); } .swatch.bisq { background: var(--l-bisq); } .swatch.payroll { background: var(--l-payroll); } .swatch.tom { background: var(--l-tom); } .swatch.meridian { background: var(--l-meridian); } .swatch.dust { background: var(--l-dust); }

.sect { padding: 14px 16px; border-bottom: 1px solid var(--seam); }
.sect h3 { margin: 0 0 10px; }
.rcp { border: 1px solid var(--seam); border-radius: 6px; background: var(--raised); }
.rcp .a { padding: 10px 12px; border-bottom: 1px solid var(--seam); font-size: 12px; word-break: break-all; }
.rcp .a .ok { color: var(--ok); font-variation-settings: "MONO" 0; font-size: 11px; display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.rcp .b { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; gap: 8px; }

    return { sel, inputs, sending, change, fee, vbytes, ok, shortBy: short > 0 ? short : 0, total: sending + fee };

  function privacy() {
    const sel = [...state.selected].map(coinById);
    const ids = [...new Set(sel.map((c) => c.source))];
    const linked = ids.map((id) => ({ id, ...sources[id], coins: sel.filter((c) => c.source === id) }));
    const kyc = linked.filter((s) => s.kyc);
    const nonKyc = linked.filter((s) => !s.kyc);
    const foreign = sel.filter((c) => c.status === "foreign-unconfirmed");
    let level = "none";
    if (linked.length === 2) level = "some";
    if (linked.length >= 3 || (kyc.length && nonKyc.length)) level = "high";
    const sending = state.recipients.reduce((a, r) => a + r.amount, 0);
    // A one-source alternative that still covers the payment, if any.
    let alt = null;
    for (const sid of sourceOrder) {
      const pool = coins.filter((c) => c.source === sid && spendable(c) && c.status === "confirmed");
      const total = pool.reduce((a, c) => a + c.value, 0);
      if (total >= sending + 3000 && sid !== "dust") { alt = { id: sid, ...sources[sid], coins: pool, total }; break; }
    }
    return { linked, kyc, nonKyc, foreign, level, alt };
  }

  // Where a fee rate sits in the mempool: MvB of transactions paying more.
  function aheadOf(rate) {
    let ahead = 0;
    for (const b of mempool) {
      if (rate < b.from) ahead += b.mvb;
      else if (rate < b.to) ahead += b.mvb * (b.to - rate) / (b.to - b.from);
    }
    return ahead;
  }
  const blocksFor = (rate) => Math.max(1, Math.ceil(aheadOf(rate) + 0.01));

  const densities = { low: { parts: 60, modules: 33 }, medium: { parts: 40, modules: 41 }, high: { parts: 24, modules: 57 } };

  // Deterministic QR-looking frame: finder patterns plus seeded noise. Not a
  // decodable QR; the real app renders UR fragments.
  function qrSvg(seed, modules, fg = "currentColor") {
    let x = seed * 9301 + 49297;
    const rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
    const n = modules, cells = [];
    const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    const sep = (r, c) => (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (sep(r, c)) continue;
      if (r === 6 || c === 6) { if ((r + c) % 2 === 0) cells.push(`M${c} ${r}h1v1h-1z`); continue; }
      if (rnd() > 0.52) cells.push(`M${c} ${r}h1v1h-1z`);
    }
    const f = (x0, y0) => `M${x0} ${y0}h7v7h-7zM${x0 + 1} ${y0 + 1}v5h5v-5zM${x0 + 2} ${y0 + 2}h3v3h-3z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="Animated QR code, part ${seed}"><path fill="${fg}" fill-rule="evenodd" d="${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}${cells.join("")}"/></svg>`;
  }

  const psbt = { id: "Coldcard order", outputs: 2, inputs: 3 };

  // Frame harness. A variant calls Proto.mount({ screens, render, after }).
  // screens: [{id,label}]; render(screenId, frameKind) returns HTML; the same
  // markup goes into a 390px phone frame and a 1280px desktop frame, each a
  // size container so layout follows the frame, not the window.
  let cfg;
  function rerender() {
    document.documentElement.dataset.theme = state.theme || "";
    document.querySelectorAll("[data-frame]").forEach((frame) => {
      const kind = frame.dataset.frame;
      const scroller = frame.querySelector("[data-scroll]");
      const top = scroller ? scroller.scrollTop : 0;
      frame.querySelector("[data-screen-root]").innerHTML = cfg.render(state.screen, kind);
      if (scroller) scroller.scrollTop = top;
    });
    document.querySelectorAll("[data-goto]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.goto === state.screen)));
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    document.body.dataset.view = state.view;
    fit();
    cfg.after && cfg.after();
  }
  function fit() {
    const wrap = document.querySelector("[data-desktop-wrap]");
    if (!wrap) return;
    const frame = wrap.querySelector("[data-frame=desktop]");
    const avail = wrap.clientWidth;
    const scale = Math.min(1, avail / 1280);
    wrap.style.setProperty("--scale", scale);
    wrap.style.height = 800 * scale + "px";
  }
  function act(e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const a = t.dataset.act, v = t.dataset.v;
    if (a === "coin") {
      const c = coinById(v);
      if (!spendable(c)) return;
      state.selected.has(v) ? state.selected.delete(v) : state.selected.add(v);
    } else if (a === "fee") state.feeRate = Number(v);
    else if (a === "fee-step") state.feeRate = Math.max(1, Math.round((state.feeRate + Number(v)) * 10) / 10);
    else if (a === "auto") { state.selected = new Set(["c1", "c2", "c4"]); }
    else if (a === "alt") { const p = privacy(); if (p.alt) state.selected = new Set(p.alt.coins.map((c) => c.id)); }
    else if (a === "clear") state.selected = new Set();
    else if (a === "conn") state.connection = v;
    else if (a === "wallet") state.wallet = v;
    else if (a === "density") { const old = densities[state.density].parts; state.density = v; state.part = Math.max(1, Math.round(state.part * densities[v].parts / old)); }
    else if (a === "fps") state.fps = Number(v);
    else if (a === "stage") state.signStage = v;
    else if (a === "goto") state.screen = v;
    else return;
    e.preventDefault();
    rerender();
  }
  function tick() {
    if (state.screen === "sign" && state.signStage === "export") {
      const total = densities[state.density].parts;
      state.part = (state.part % total) + 1;
      document.querySelectorAll("[data-qr]").forEach((el) => { el.innerHTML = qrSvg(state.part, densities[state.density].modules); });
      document.querySelectorAll("[data-part]").forEach((el) => { el.textContent = state.part; });
      document.querySelectorAll("[data-part-bar]").forEach((el) => { el.style.setProperty("--p", state.part / total); });
      cfg.onTick && cfg.onTick(state.part, total);
    }
    setTimeout(tick, 1000 / state.fps);
  }
  function mount(c) {
    cfg = c;
    document.addEventListener("click", (e) => {
      const g = e.target.closest("[data-goto]");
      if (g) { state.screen = g.dataset.goto; rerender(); return; }
      const v = e.target.closest("[data-view]");
      if (v) { state.view = v.dataset.view; rerender(); return; }
      const th = e.target.closest("[data-theme-toggle]");
      if (th) {
        const dark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        state.theme = dark ? "light" : "dark";
        rerender();
        return;
      }
      act(e);
    });
    document.addEventListener("change", (e) => {
      if (e.target.matches("[data-fee-input]")) {
        const n = Number(e.target.value);
        if (n >= 1 && n <= 500) { state.feeRate = n; rerender(); }
      }
    });
    const params = new URLSearchParams(location.search);
    if (params.get("screen")) state.screen = params.get("screen");
    if (params.get("view")) state.view = params.get("view");
    if (params.get("theme")) state.theme = params.get("theme");
    if (params.get("conn")) state.connection = params.get("conn");
    if (params.get("stage")) state.signStage = params.get("stage");
    addEventListener("resize", fit);
    rerender();
    if (!params.get("still")) tick();
  }

  window.Proto = { TIP, NOW, sources, sourceOrder, coins, history, wallets, mempool, feePresets, state, densities, psbt,
    coinById, confs, spendable, ageOf, btcParts, btc, sats, short, dateOf, timeOf, balances, txSummary, privacy, aheadOf, blocksFor, qrSvg, mount, rerender };
})();
</script>
<script>
(() => {
  const P = Proto, S = P.state;
  let phoneTab = new URLSearchParams(location.search).get("tab") || "coins";
  const scrolls = {};

  const ic = {
    wallet: '<path d="M3 6.5h13a1 1 0 0 1 1 1V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h10"/><path d="M13 11.5h4"/>',
    coins: '<ellipse cx="8" cy="6" rx="5" ry="2.5"/><path d="M3 6v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V6"/><path d="M7 14.4c.3 1.3 2.4 2.1 5 2.1 2.8 0 5-1.1 5-2.5V10c0-1.2-1.6-2.2-3.8-2.4"/>',
    send: '<path d="M5 15 15 5"/><path d="M7 5h8v8"/>',
    receive: '<path d="M15 5 5 15"/><path d="M13 15H5V7"/>',
    addr: '<path d="M4 7h12M4 13h12M8 3 7 17M13 3l-1 14"/>',
    gear: '<circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/>',
    lock: '<rect x="4" y="9" width="12" height="8" rx="1"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/>',
    down: '<path d="m6 8 4 4 4-4"/>',
    alert: '<path d="M10 3 2.5 16.5h15L10 3Z"/><path d="M10 8.5v3.5M10 14.2v.3"/>',
    check: '<path d="m4.5 10.5 3.5 3.5 7.5-8"/>',
    scan: '<path d="M3 7V4h3M14 4h3v3M17 13v3h-3M6 16H3v-3"/><path d="M6 10h8"/>',
    plus: '<path d="M10 4v12M4 10h12"/>',
    file: '<path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11 2.5V6h4"/>',
    ext: '<path d="M8 4H4v12h12v-4"/><path d="M11 4h5v5M16 4l-7 7"/>',
    copy: '<rect x="7" y="7" width="9" height="10" rx="1"/><path d="M13 7V4H4v10h3"/>',
    snow: '<path d="M10 2.5v15M3.5 6.2l13 7.6M3.5 13.8l13-7.6"/>',
    clock: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/>',
    cam: '<path d="M3 6.5h3l1.5-2h5l1.5 2h3v9.5H3z"/><circle cx="10" cy="11" r="3"/>',
  };
  const svg = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;

  const amt = (v, opts = {}) => {
    const p = P.btcParts(v);
    const sign = opts.signed ? (v < 0 ? "−" : "+") : p.sign;
    return `<span class="amt ${opts.cls || ""}">${sign ? `<span class="sg">${sign}</span>` : ""}<span class="ld">${p.lead}</span>${p.rest}${opts.unit ? '<span class="u">BTC</span>' : ""}</span>`;
  };
  const confText = (h) => { const n = P.confs(h); return n === 0 ? "Unconfirmed" : n < 6 ? `${n} conf` : `${P.sats(n)} conf`; };
  const wallet = () => P.wallets.find((w) => w.id === S.wallet);
  const host = S.server.replace(/^wss?:\/\//, "");

  // Mempool histogram packed into projected 1 MvB blocks.
  function projected() {
    const out = []; let cur = { mvb: 0, max: null, min: null };
    for (const b of P.mempool) {
      let used = 0;
      while (used < b.mvb - 1e-9) {
        const take = Math.min(1 - cur.mvb, b.mvb - used);
        const rateAt = (u) => b.to - (b.to - b.from) * (u / b.mvb);
        if (cur.max == null) cur.max = rateAt(used);
        used += take; cur.mvb += take; cur.min = rateAt(used);
        if (cur.mvb >= 0.999) { out.push(cur); cur = { mvb: 0, max: null, min: null }; }
      }
    }
    if (cur.mvb > 0) out.push(cur);
    return out;
  }
  const BLOCKS = projected();
  const fmtRate = (r) => (r >= 10 ? Math.round(r) : Math.round(r * 10) / 10).toString();
  const tileRate = (r) => String(Math.floor(r));
  // Presets derived from the node's own histogram, not a fixed table.
  const presets = [
    { name: "Next block", rate: Math.ceil(BLOCKS[0].min + 1) },
    { name: "About 30 min", rate: Math.ceil(BLOCKS[2].min + 0.5) },
    { name: "About an hour", rate: Math.ceil(BLOCKS[5].min + 0.5) },
    { name: "No rush", rate: 2 },
  ];

  // Lanes: one per source, in order of first appearance in the coin list.
  const sorted = [...P.coins].sort((a, b) => b.value - a.value);
  const laneOf = {}; sorted.forEach((c) => { if (!(c.source in laneOf)) laneOf[c.source] = Object.keys(laneOf).length; });
  const LANES = Object.keys(laneOf).length;

  function coinRows(kind) {
    const RH = kind === "phone" ? 60 : 50, GAP = kind === "phone" ? 7 : 10, X0 = 10;
    const GW = X0 * 2 + GAP * (LANES - 1);
    const x = (src) => X0 + laneOf[src] * GAP;
    const selSrc = new Set([...S.selected].map((id) => P.coinById(id).source));
    const first = {}, last = {};
    sorted.forEach((c, i) => { if (!(c.source in first)) first[c.source] = i; last[c.source] = i; });
    const rows = sorted.map((c, i) => {
      let g = "";
      for (const src in laneOf) {
        const on = selSrc.has(src);
        const end = on ? Infinity : last[src];
        if (i < first[src] || i > end) continue;
        const y1 = i === first[src] ? RH / 2 : 0;
        const y2 = i === end ? RH / 2 : RH;
        g += `<line class="ln ${src} ${on ? "" : "dim"}" x1="${x(src)}" x2="${x(src)}" y1="${y1}" y2="${y2}"/>`;
      }
      const sel = S.selected.has(c.id), ok = P.spendable(c);
      g += `<circle class="nd ${c.source} ${!ok ? "frozen" : sel ? "on" : "off"}" cx="${x(c.source)}" cy="${RH / 2}" r="${sel ? 5 : 4}"/>`;
      const s = P.sources[c.source];
      let badge = "";
      if (c.frozen) badge = `<span class="chip">${svg("snow", 11)} Frozen</span>`;
      else if (c.status === "own-change") badge = `<span class="chip">Own change, unconfirmed</span>`;
      else if (c.status === "foreign-unconfirmed") badge = `<span class="chip warn">Unconfirmed, from others</span>`;
      const meta = c.height == null ? "" : `<span class="num">${P.ageOf(c)}</span><span class="num">${confText(c.height)}</span>`;
      return `<li><button class="coin" data-act="coin" data-v="${c.id}" aria-pressed="${sel}" ${ok ? "" : 'aria-disabled="true"'} aria-label="${s.short} coin, ${P.btc(c.value)} BTC, ${c.label}">
        <svg class="g" viewBox="0 0 ${GW} ${RH}" aria-hidden="true">${g}</svg>
        <span class="body"><span class="l1">${amt(c.value)}<span class="lab">${c.label}</span></span>
        <span class="l2"><span class="src ${c.source}">${s.short}</span>${meta}${badge}</span></span>
        <span class="tick"><span class="box">${sel ? svg("check", 14) : ""}</span></span></button></li>`;
    }).join("");
    // Foot of the graph: selected lanes bend into one trunk.
    const sels = [...selSrc].sort((a, b) => laneOf[a] - laneOf[b]);
    const H = 64, mx = sels.length ? x(sels[0]) : X0;
    let foot = "";
    sels.forEach((src) => { foot += `<path class="ln ${src}" d="M${x(src)} 0 C ${x(src)} ${H * 0.45}, ${mx} ${H * 0.35}, ${mx} ${H * 0.7}"/>`; });
    if (sels.length) foot += `<line class="trunk" x1="${mx}" x2="${mx}" y1="${H * 0.7}" y2="${H}"/><circle cx="${mx}" cy="${H * 0.7}" r="3.5" class="nd on" fill="currentColor"/>`;
    const n = sels.length;
    const msg = n === 0 ? ["No coins selected", "Pick coins above, or let the wallet choose."]
      : n === 1 ? ["One source", "Nothing new is linked by this transaction."]
      : [`${n} sources merge here`, "Once broadcast, these lanes stay joined on-chain."];
    const merge = `<div class="merge"><svg viewBox="0 0 ${GW} ${H}" aria-hidden="true">${foot}</svg><div class="m"><b>${msg[0]}</b><span>${msg[1]}</span></div></div>`;
    return { html: `<ul class="coins" style-gw>${rows}</ul>${merge}`, GW, RH };
  }

  // Fewest sources that cover the payment, preferring sources of one kind.
  function betterPick() {
    const t = P.txSummary();
    const need = t.sending + 4000;
    const pools = Object.keys(P.sources).filter((k) => k !== "dust").map((k) => {
      const cs = P.coins.filter((c) => c.source === k && P.spendable(c) && c.status !== "foreign-unconfirmed");
      return { k, cs, total: cs.reduce((a, c) => a + c.value, 0), kyc: P.sources[k].kyc };
    }).filter((p) => p.cs.length);
    const one = pools.filter((p) => p.total >= need).sort((a, b) => a.total - b.total)[0];
    if (one) return [one];
    let best = null;
    for (let i = 0; i < pools.length; i++) for (let j = i + 1; j < pools.length; j++) {
      const a = pools[i], b = pools[j];
      if (a.total + b.total < need) continue;
      const score = (a.kyc === b.kyc ? 0 : 1e9) + a.total + b.total;
      if (!best || score < best.score) best = { score, set: [a, b] };
    }
    return best ? best.set : null;
  }

  function shellTop(kind) {
    const w = wallet();
    const net = w.network === "regtest" ? '<span class="chip reg">Regtest</span>' : "";
    return `<header class="top">
      <button class="wsw" aria-haspopup="listbox" aria-label="Switch wallet, current ${w.name}">${w.name} ${net}${svg("down", 14)}</button>
      <span class="status" title="Connected"><span class="dot"></span><span class="host mono">${kind === "phone" ? "" : host + " · "}block ${P.sats(P.TIP)}</span></span>
      <button class="iconbtn" aria-label="Lock wallet">${svg("lock")}</button>
    </header>`;
  }
  function rail() {
    const it = (id, n, label) => `<button class="iconbtn ${S.screen === id || (id === "send" && S.screen === "sign") ? "on" : ""}" ${id ? `data-goto="${id}"` : ""} aria-label="${label}" title="${label}">${svg(n, 20)}</button>`;
    return `<nav class="rail" aria-label="Main">${it("home", "wallet", "Wallet")}${it("", "coins", "Coins")}${it("send", "send", "Send")}${it("", "receive", "Receive")}${it("", "addr", "Addresses")}<span class="spacer"></span>${it("", "gear", "Settings")}</nav>`;
  }
  function tabs() {
    const t = (id, n, l) => `<button class="${S.screen === id || (id === "send" && S.screen === "sign") ? "on" : ""}" ${id ? `data-goto="${id}"` : ""}>${svg(n, 20)}${l}</button>`;
    return `<nav class="tabs" aria-label="Main">${t("home", "wallet", "Wallet")}${t("", "coins", "Coins")}${t("send", "send", "Send")}${t("", "receive", "Receive")}</nav>`;
  }
  const shell = (kind, body) => `<div class="app">${rail()}${shellTop(kind)}<div class="main" data-scroll="main">${body}</div>${tabs()}</div>`;

  /* Connect */
  function connect(kind) {
    const st = S.connection;
    const left = `<div class="left" data-scroll="cl">
      <div class="intro"><h2>Connect to your Electrum server</h2>
      <p>This wallet talks only to a server you run. There is no default server and it never falls back to a public one.</p></div>
      <div class="form">
        <div class="field"><label for="srv-${kind}">Server address</label>
        <div class="row"><div class="input"><input id="srv-${kind}" class="mono" value="${S.server}" spellcheck="false" autocomplete="off"></div>
        <button class="btn primary" data-act="conn" data-v="connecting">${st === "cert" ? "Retry" : "Connect"}</button></div>
        <span class="hint">Use wss:// from this hosted page. Plain ws:// only works when the app runs on localhost.</span></div>
        <div class="field"><label>Network</label><div class="seg" role="group"><button aria-pressed="true">Mainnet</button><button>Signet</button><button>Regtest</button></div></div>
        <div class="recent">Recent <button class="mono">fulcrum.tail4b2c1.ts.net:50004</button></div>
      </div>
      ${st === "cert" ? `<section class="err" role="alert">
        <div class="eh">${svg("alert", 20)}<div><h3>Certificate rejected</h3>
        <p>Your server answered, but the browser refused its TLS certificate, most likely because it is self-signed. WebSockets have no "continue anyway" button, so the certificate has to be accepted in a normal tab first.</p></div></div>
        <ol class="steps">
          <li><b>Open the server's https address in a new tab</b><span class="sub"><code>https://${host}</code></span></li>
          <li><b>Accept the certificate</b><span class="sub">The browser warns that the connection is not private. If you know your server's fingerprint, compare it, then choose to proceed.</span></li>
          <li><b>Expect an error page, then close the tab</b><span class="sub">Electrum servers do not serve web pages. The browser now trusts the certificate for this session.</span></li>
          <li><b>Come back and retry</b><span class="sub">The connection should go through. If it still fails, the details below say where.</span></li>
        </ol>
        <div class="acts"><button class="btn primary" data-act="conn" data-v="connecting">Retry connection</button><button class="btn">${svg("ext", 16)} Open https://${host}</button></div>
      </section>
      <div class="alt"><div><b>Avoid the self-signed certificate</b><p>Serve Fulcrum through Tailscale and use <span class="mono">tailscale cert</span> for a certificate every browser trusts. No port forwarding.</p></div>
      <div><b>Stay on your own network</b><p>Run the app from its container on localhost. A localhost page may open plain ws:// to your node.</p></div></div>` : ""}
      ${st === "connecting" ? `<ul class="checklist" aria-live="polite">
        <li><span class="s done">${svg("check", 16)}</span>Address resolved</li>
        <li><span class="s done">${svg("check", 16)}</span>Port open</li>
        <li><span class="s"><span class="spin"></span></span>TLS handshake</li>
        <li><span class="s wait">${svg("clock", 16)}</span><span class="hint">Electrum server version check</span></li></ul>` : ""}
      <p class="trust">The hosted app is convenience-grade: whoever controls its domain could serve different code. Version 0.1.0, build a41f9c2. Run it from the container to pin the code you use.</p>
    </div>`;
    const right = kind === "desktop" ? `<div class="right" data-scroll="cr"><div class="ph"><span class="cap">Connection log</span></div>
      <pre class="log mono">${st === "cert"
        ? `<span class="t">09:40:02</span> open ${S.server}\n<span class="t">09:40:02</span> <span class="good">TCP connected</span>\n<span class="t">09:40:02</span> <span class="bad">TLS handshake failed: certificate not trusted</span>\n<span class="t">09:40:02</span> WebSocket closed, code 1006\n<span class="t">09:40:02</span> classified: certificate rejected`
        : st === "connecting" ? `<span class="t">09:41:10</span> open ${S.server}\n<span class="t">09:41:10</span> <span class="good">TCP connected</span>\n<span class="t">09:41:10</span> TLS handshake…`
        : `<span class="t">No attempts yet.</span>`}</pre>
      <div class="ph"><span class="cap">Failures this screen tells apart</span></div>
      <ul class="checklist"><li>Certificate rejected</li><li>Connection refused</li><li>Timed out</li><li>Answered, but not an Electrum server</li></ul></div>` : "";
    return `<div class="app"><header class="top"><b>Watch-only wallet</b><span class="status"><span class="dot ${st === "cert" ? "danger" : st === "connecting" ? "warn" : "warn"}"></span>${st === "cert" ? "Not connected" : st === "connecting" ? "Connecting" : "Not connected"}</span></header><div class="main"><div class="connect">${left}${right}</div></div></div>`;
  }

  /* Home */
  function home(kind) {
    const b = P.balances();
    const balance = `<section class="bal" aria-label="Balance">
      <div class="big"><div class="cap">Confirmed</div>${amt(b.confirmed, { unit: true })}</div>
      <div class="sub"><div><div class="cap">Unconfirmed</div>${amt(b.unconfirmed, { signed: true })}<div class="note">0.01 204 551 own change, 0.00 300 000 from others</div></div>
      <div><div class="cap">Frozen</div>${amt(b.frozen)}<div class="note">1 coin, not spendable or counted</div></div></div></section>`;
    const sync = `<div class="sync"><span class="dot"></span><span>Synced to block <span class="num">${P.sats(P.TIP)}</span>, 9 s ago. Watching 52 addresses.</span></div>`;
    const rows = P.history.map((t) => {
      const pend = t.height == null;
      return `<li class="tx ${pend ? "pending" : ""}">
        <span class="dt num">${P.dateOf(t.time)}</span>
        <span class="lab">${t.label}</span>
        ${amt(t.amount, { signed: true, cls: t.amount > 0 ? "in" : "" })}
        <span class="right">${pend ? `<span class="chip warn">Unconfirmed</span>` : `<span class="num">${confText(t.height)}</span>`}</span>
        <span class="meta m"><span class="num">${P.dateOf(t.time)}, ${P.timeOf(t.time)}</span><span class="mono">${P.short(t.txid, 6, 4)}</span>${pend && t.rbf ? '<button class="btn sm">Bump fee</button>' : ""}</span>
      </li>`;
    }).join("");
    const head = `<div class="th cap"><span>Date</span><span>Label</span><span>Status</span><span>Amount</span></div>`;
    const list = `<div class="filter"><div class="input">${svg("addr", 14)}<input placeholder="Filter by label, amount or date" aria-label="Filter transactions"></div>
      <div class="seg" role="group"><button aria-pressed="true">All</button><button>In</button><button>Out</button><button>Pending</button></div></div>${head}<ul class="txl">${rows}</ul>`;
    const wl = `<div class="ph"><span class="cap">Wallets</span><button class="btn sm ghost">${svg("plus", 14)} Add</button></div><ul class="wallets">${P.wallets.map((w) => `<li><button data-act="wallet" data-v="${w.id}" aria-current="${w.id === S.wallet}"><span class="n">${w.name}</span><span class="chip ${w.network === "regtest" ? "reg" : ""}">${w.network === "regtest" ? "Regtest" : w.kind === "tr" ? "Taproot" : "SegWit"}</span><span class="d">${w.id === "spending" ? "10 coins" : w.id === "savings" ? "4 coins, last used Jun" : "Test coins only"}</span></button></li>`).join("")}</ul>`;
    if (kind === "phone") return shell(kind, `${balance}${sync}<div class="ph"><span class="cap">History</span><span class="hint">${P.history.length} transactions</span></div>${list}`);
    return shell(kind, `<div class="home"><aside class="home-side" data-scroll="hs">${balance.replace('class="bal"', 'class="bal"')}${sync}${wl}</aside><div class="home-main" data-scroll="hm">${list}</div></div>`);
  }

  /* Send */
  function send(kind) {
    const t = P.txSummary(), pv = P.privacy();
    const cr = coinRows(kind);
    const nSel = S.selected.size, nSpend = P.coins.filter(P.spendable).length;
    const coinsCol = `<div class="colh"><span class="cap">Coins</span></div>
      <div class="coinbar"><span class="cnt"><b>${nSel}</b> of ${nSpend} spendable selected</span>
      <button class="btn sm" data-act="auto">Choose for me</button><button class="btn sm ghost" data-act="clear">Clear</button></div>
      ${cr.html.replace("style-gw", `data-gw`)}`;
    const blocks = BLOCKS.slice(0, 8);
    const yours = P.blocksFor(S.feeRate);
    const tiles = blocks.map((b, i) => `<div class="blk f${Math.min(3, i)} ${yours === i + 1 ? "you" : ""}"><span class="r num">${tileRate(b.min)}+</span><span class="s num">+${i + 1}</span></div>`).join("")
      + `<div class="blk later ${yours > 8 ? "you" : ""}"><span class="r num">1 to ${tileRate(BLOCKS[8].max)}</span><span class="s num">${BLOCKS.length - 8} more</span></div>`;
    const mins = yours * 10;
    const build = `<div class="colh"><span class="cap">Payment</span></div>
      <section class="sect"><h3 class="cap">Recipient</h3>
        ${S.recipients.map((r) => `<div class="rcp"><div class="a mono">${r.address}<span class="ok">${svg("check", 12)} Valid mainnet address, not one of yours</span></div>
        <div class="b">${amt(r.amount, { unit: true })}<span class="rl">${r.label}</span></div></div>`).join("")}
        <div class="racts"><button class="btn sm">${svg("scan", 14)} Scan</button><button class="btn sm">${svg("plus", 14)} Add recipient</button><button class="btn sm ghost">Send all selected</button></div>
      </section>
      <section class="sect"><h3 class="cap">Fee rate</h3>
        <div class="fees">${presets.map((p) => `<button class="fee" data-act="fee" data-v="${p.rate}" aria-pressed="${S.feeRate === p.rate}"><span class="n">${p.name}</span><span class="r num">${p.rate} sat/vB</span></button>`).join("")}</div>
        <div class="custom"><button class="btn sm" data-act="fee-step" data-v="-1" aria-label="Lower fee rate">−</button>
          <label class="input"><input class="mono" data-fee-input type="number" min="1" step="0.1" value="${S.feeRate}" aria-label="Fee rate in sat/vB"><span>sat/vB</span></label>
          <button class="btn sm" data-act="fee-step" data-v="1" aria-label="Raise fee rate">+</button></div>
        <div class="pool"><div class="blocks" role="img" aria-label="Projected next blocks from your node's mempool">${tiles}</div>
        <p class="poolnote">From your node's mempool: <b class="num">${P.aheadOf(S.feeRate).toFixed(1)} MvB</b> pays more than <b class="num">${fmtRate(S.feeRate)} sat/vB</b>. About ${yours} ${yours === 1 ? "block" : "blocks"}, roughly ${mins >= 90 ? Math.round(mins / 60 * 2) / 2 + " hours" : mins + " minutes"} if nothing new arrives.</p></div>
      </section>`;
    const level = pv.linked.length >= 2 ? "high" : "none";
    const pick = betterPick();
    const pickIds = pick ? pick.flatMap((p) => p.cs.map((c) => c.id)) : [];
    const pickSame = pick && pickIds.length === S.selected.size && pickIds.every((id) => S.selected.has(id));
    const why = (s) => s.kyc ? "Knows who you are" : "No identity attached";
    let privBody;
    if (!pv.linked.length) privBody = `<p>Select coins to see what this transaction would reveal.</p>`;
    else if (pv.linked.length === 1) privBody = `<p><strong>Every coin comes from ${pv.linked[0].name}.</strong> These coins are already linked, so nothing new is joined.</p>`;
    else {
      privBody = `<p><strong>This spends coins from ${pv.linked.length} separate sources, permanently linking them.</strong> Anyone reading the chain can assume they belong to one person.</p>
        <ul class="linked">${pv.linked.map((s) => `<li><span class="swatch ${s.id}"></span><span>${s.name}</span><span class="c num">${s.coins.length} ${s.coins.length === 1 ? "coin" : "coins"}</span><span class="why">${why(s)}</span></li>`).join("")}</ul>`;
      if (pv.kyc.length && pv.nonKyc.length) privBody += `<p>${pv.kyc.map((s) => s.short).join(" and ")} ${pv.kyc.length === 1 ? "knows" : "know"} your identity. After this, ${pv.nonKyc.map((s) => s.short).join(" and ")} coins can be tied to it too.</p>`;
      if (pick && !pickSame) privBody += `<div class="fix"><p>${pick.length === 1 ? `${pick[0].k === "kraken" ? "" : ""}${P.sources[pick[0].k].name} alone covers this payment.` : `${P.sources[pick[0].k].short} and ${P.sources[pick[1].k].short} together cover it, and both already ${pick[0].kyc ? "know who you are" : "carry no identity"}.`}</p>
        <button class="btn sm" data-g-sel="${pickIds.join(",")}">Use ${pick.map((p) => P.sources[p.k].short).join(" and ")} coins only</button></div>`;
    }
    const foreign = pv.foreign.length ? `<div class="warnline">${svg("alert", 14)}<span>One coin is an unconfirmed payment from someone else. They can still replace it, which would cancel this transaction.</span></div>` : "";
    const chipTxt = pv.linked.length >= 2 ? `Links ${pv.linked.length} sources` : pv.linked.length === 1 ? "1 source" : "No coins";
    const review = `<div class="colh"><span class="cap">Review</span></div>
      <section class="sect"><div class="priv ${level}" aria-live="polite"><div class="h">${level === "high" ? svg("alert", 16) : svg("check", 16)}<b>Privacy</b><span class="chip ${level === "high" ? "warn" : ""}">${chipTxt}</span></div><div class="bd">${privBody}${foreign}</div></div></section>
      <section class="sect"><div class="rows">
        <div class="kv"><span class="k">Inputs, ${t.sel.length} ${t.sel.length === 1 ? "coin" : "coins"}</span><span class="v">${amt(t.inputs)}</span></div>
        <div class="kv"><span class="k">Sending</span><span class="v">${amt(t.sending)}</span></div>
        <div class="kv"><span class="k">Fee</span><span class="v"><span class="num">${P.sats(t.fee)} sats</span><small class="num">${fmtRate(S.feeRate)} sat/vB, ${t.vbytes} vB</small></span></div>
        <div class="kv"><span class="k">Change</span><span class="v">${t.change ? amt(t.change) : '<span class="hint">None</span>'}${t.change ? '<small class="mono">to m/84\'/0\'/0\'/1/10</small>' : ""}</span></div>
        <div class="kv total"><span class="k">Leaves wallet</span><span class="v">${amt(t.total, { unit: true })}</span></div>
      </div></section>
      <div class="go">${t.ok ? `<button class="btn primary block" data-goto="sign">Create PSBT and sign</button>` : `<button class="btn primary block" aria-disabled="true">Create PSBT and sign</button><span class="hint">Selected coins are short by <span class="num">${P.sats(t.shortBy)} sats</span></span>`}
      <span class="hint">Replaceable (RBF), so you can raise the fee later.</span></div>`;
    if (kind === "desktop") return shell(kind, `<div class="send"><div class="cols"><div class="col c1" data-scroll="s1">${coinsCol}</div><div class="col c2" data-scroll="s2">${build}</div><div class="col c3" data-scroll="s3">${review}</div></div></div>`);
    const order = ["coins", "build", "review"];
    const next = order[(order.indexOf(phoneTab) + 1) % 3];
    const foot = `<footer class="foot">
      <div class="fl"><span><small>In, ${t.sel.length} ${t.sel.length === 1 ? "coin" : "coins"}</small>${amt(t.inputs)}</span><span><small>Fee, sats</small><span class="num">${P.sats(t.fee)}</span></span><span><small>Change</small>${amt(t.change)}</span></div>
      <div class="fr"><span class="chip ${level === "high" ? "warn" : ""}">${level === "high" ? svg("alert", 12) : ""}${chipTxt}</span>${phoneTab === "review" ? (t.ok ? `<button class="btn primary" data-goto="sign">Create PSBT</button>` : `<button class="btn primary" aria-disabled="true">Short by ${P.sats(t.shortBy)}</button>`) : `<button class="btn primary" data-g-tab="${next}">${next === "build" ? "Payment" : "Review"}</button>`}</div></footer>`;
    const seg = `<div class="ptabs"><div class="seg" role="tablist">${[["coins", "Coins", S.selected.size], ["build", "Payment", ""], ["review", "Review", ""]].map(([id, l, n]) => `<button role="tab" data-g-tab="${id}" aria-pressed="${phoneTab === id}">${l}${n !== "" ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div></div>`;
    const body = phoneTab === "coins" ? coinsCol : phoneTab === "build" ? build : review;
    return `<div class="app">${shellTop(kind)}<div class="send">${seg}<div class="cols" data-scroll="ps-${phoneTab}">${body}</div>${foot}</div>${tabs()}</div>`;
  }

  /* Sign */
  function sign(kind) {
    const t = P.txSummary();
    const d = P.densities[S.density], st = S.signStage;
    const steps = `<div class="stepper">${[["export", "Show to signer"], ["scan", "Scan signed PSBT"], ["verified", "Broadcast"]].map(([id, l], i, a) => {
      const idx = a.findIndex((x) => x[0] === st);
      return `<div class="${id === st ? "on" : i < idx ? "done" : ""}"><span class="k">${i + 1}</span>${l}</div>`;
    }).join("")}</div>`;
    const cells = (n, on, cur) => `<div class="cells n${n} ${kind === "desktop" && n <= 40 ? "big" : ""}" ${st === "export" ? "data-g-cells" : ""} aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="${on(i + 1) ? "on" : ""} ${cur === i + 1 ? "cur" : ""}"></i>`).join("")}</div>`;
    const summary = `<div class="check"><h3 class="cap">Check on your signer</h3><p>Your signer should show exactly this before you approve.</p><div class="rows">
      <div class="kv"><span class="k">Pay</span><span class="v">${amt(t.sending, { unit: true })}<small class="mono">${P.short(S.recipients[0].address, 10, 6)}</small></span></div>
      <div class="kv"><span class="k">Change</span><span class="v">${amt(t.change)}<small class="mono">m/84'/0'/0'/1/10</small></span></div>
      <div class="kv"><span class="k">Fee</span><span class="v"><span class="num">${P.sats(t.fee)} sats</span><small class="num">${fmtRate(S.feeRate)} sat/vB</small></span></div>
      <div class="kv"><span class="k">Inputs</span><span class="v num">${t.sel.length}</span></div></div></div>
      <div class="check"><h3 class="cap">No camera?</h3><p>Move the PSBT by file instead, for example on a microSD card.</p><div class="racts"><button class="btn sm">${svg("file", 14)} Save PSBT file</button><button class="btn sm">${svg("file", 14)} Load signed file</button></div></div>`;
    let main;
    if (st === "export") {
      main = `<div class="qrwrap">
        <div class="plate" data-qr>${P.qrSvg(S.part, d.modules)}</div>
        <div class="counter"><span class="big num"><span data-part>${S.part}</span> <span class="of">of ${d.parts}</span></span><span class="hint">Parts loop until your signer has them all.</span></div>
        ${cells(d.parts, (i) => i <= S.part, S.part)}
        <div class="ctrls">
          <div class="ctrl"><div class="lbl">Speed <span>frames per second</span></div><div class="seg" role="group">${[2, 4, 6, 8].map((f) => `<button data-act="fps" data-v="${f}" aria-pressed="${S.fps === f}">${f}</button>`).join("")}</div></div>
          <div class="ctrl"><div class="lbl">Density <span>fewer, denser parts</span></div><div class="seg" role="group">${Object.entries(P.densities).map(([k, v]) => `<button data-act="density" data-v="${k}" aria-pressed="${S.density === k}">${k[0].toUpperCase() + k.slice(1)} · ${v.parts}</button>`).join("")}</div></div>
          <button class="btn primary block" data-act="stage" data-v="scan">${svg("cam", 16)} Signed it, scan it back</button>
        </div></div>`;
    } else if (st === "scan") {
      const n = S.captured.size, total = 40;
      main = `<div class="qrwrap">
        <div class="viewfinder" role="img" aria-label="Camera view"><div class="noise"></div><div class="qr">${P.qrSvg(7, 41)}</div><div class="tgt"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 18V0h18M82 0h18v18M100 82v18H82M18 100H0V82"/></svg></div><span class="cam">Back camera</span></div>
        <div class="counter"><span class="big num">${n} <span class="of">of ${total}</span></span><span class="hint">Parts arrive in any order. Hold steady until every cell fills.</span></div>
        ${cells(total, (i) => S.captured.has(i), 0)}
        <div class="ctrls"><button class="btn block" data-act="stage" data-v="export">Back to the QR</button><button class="btn primary block" data-act="stage" data-v="verified">Simulate last parts</button></div>
      </div>`;
    } else {
      main = `<div class="verpane"><h2>Signed and checked</h2><p>The PSBT that came back matches the one you built.</p>
        <ul class="ver">
          <li>${svg("check", 18)}<span>All ${t.sel.length} inputs signed</span><span class="sub">Finalised, ready to broadcast.</span></li>
          <li>${svg("check", 18)}<span>Outputs match what you built</span><span class="sub"><span class="num">${P.btc(t.sending)}</span> to <span class="mono">${P.short(S.recipients[0].address, 10, 6)}</span>, change <span class="num">${P.btc(t.change)}</span> to your m/84'/0'/0'/1/10</span></li>
          <li>${svg("check", 18)}<span>Fee unchanged</span><span class="sub"><span class="num">${P.sats(t.fee)} sats</span> at ${fmtRate(S.feeRate)} sat/vB, replaceable</span></li>
        </ul>
        <div class="bcast"><button class="btn primary">Broadcast through ${host}</button><span class="hint">Sent only to your own server. It appears in your history as unconfirmed straight away.</span></div>
        <div class="bcast"><button class="btn destructive">Discard this transaction</button></div></div>`;
    }
    const body = `<div class="sign">${steps}<div class="signbody"><div data-scroll="sg">${main}</div>${kind === "desktop" ? `<aside class="side" data-scroll="ss">${summary}</aside>` : summary}</div></div>`;
    return kind === "desktop" ? shell(kind, body) : shell(kind, body);
  }

  function statesBar() {
    const el = document.querySelector("[data-states]");
    const mk = (act, cur, opts) => `<span class="lbl">State</span><div class="seg" role="group">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
    el.innerHTML = S.screen === "connect" ? mk("conn", S.connection, [["idle", "Empty"], ["connecting", "Connecting"], ["cert", "Certificate rejected"]])
      : S.screen === "sign" ? mk("stage", S.signStage, [["export", "Export"], ["scan", "Scan back"], ["verified", "Verified"]]) : "";
  }

  document.addEventListener("click", (e) => {
    const tab = e.target.closest("[data-g-tab]");
    if (tab) { phoneTab = tab.dataset.gTab; P.rerender(); return; }
    const sel = e.target.closest("[data-g-sel]");
    if (sel) { S.selected = new Set(sel.dataset.gSel.split(",")); P.rerender(); return; }
    if (e.target.closest("[data-g-theme]")) { S.theme = S.theme === "light" ? "dark" : "light"; P.rerender(); }
  });
  document.addEventListener("scroll", (e) => {
    const el = e.target; if (!el.dataset || !el.dataset.scroll) return;
    const f = el.closest("[data-frame]"); if (f) scrolls[f.dataset.frame + ":" + el.dataset.scroll] = el.scrollTop;
  }, true);

  P.mount({
    render(screen, kind) {
      return screen === "connect" ? connect(kind) : screen === "home" ? home(kind) : screen === "sign" ? sign(kind) : send(kind);
    },
    after() {
      statesBar();
      document.querySelectorAll("[data-frame]").forEach((f) => f.querySelectorAll("[data-scroll]").forEach((el) => {
        const v = scrolls[f.dataset.frame + ":" + el.dataset.scroll]; if (v) el.scrollTop = v;
      }));
      document.querySelectorAll("[data-gw]").forEach((ul) => {
        const svgEl = ul.querySelector("svg.g"); if (!svgEl) return;
        const w = svgEl.viewBox.baseVal.width, h = svgEl.viewBox.baseVal.height;
        const frame = ul.closest("[data-frame]");
        frame.style.setProperty("--gw", w + "px"); frame.style.setProperty("--rh", h + "px");
      });
    },
    onTick(part, total) {
      document.querySelectorAll("[data-g-cells]").forEach((el) => el.querySelectorAll("i").forEach((c, i) => { c.className = (i + 1 <= part ? "on" : "") + (i + 1 === part ? " cur" : ""); }));
    },
  });
})();
</script>
</body>
</html>
