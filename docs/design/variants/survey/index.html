:root {
  color-scheme: light;
  --paper: #F5F3EC; --sheet: #FFFEFA; --sunk: #EEEBE1;
  --ink: #1B2A2E; --ink-2: #445356; --ink-3: #5A686B;
  --rule: #DCD7CA; --rule-2: #C6BFAD;
  --legend: #163847; --legend-ink: #F2EEE3; --legend-ink-2: #AFC4CD; --legend-rule: #2B5062; --legend-hi: #23495B;
  --route: #AD1A68; --route-ink: #FFFFFF; --route-tint: #F8E6EF; --route-tint-2: #EBC3D7;
  --contour: #A8642A; --relief: #EFE5D0; --relief-2: #E3D3B2;
  --ok: #2B7238; --ok-tint: #E1EFDD; --warn: #7F5300; --warn-tint: #FBEBC6; --bad: #A8261D; --bad-tint: #F8DFDA;
  --t-kraken: #D2E7F1; --e-kraken: #2B78A0;
  --t-bisq: #D5E8C2; --e-bisq: #4A812F;
  --t-payroll: #F1E1B4; --e-payroll: #8F6410;
  --t-tom: #E7DBF1; --e-tom: #74509E;
  --t-ocean: #CDE9E1; --e-ocean: #267A6A;
  --t-dust: #E5E2DA; --e-dust: #6F6C64;
  --t-meridian: #F5D5CC; --e-meridian: #A84434;
  --shadow: 0 1px 2px rgb(27 42 46 / .06), 0 6px 18px -6px rgb(27 42 46 / .14);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 17px; --fs-lg: 21px; --fs-xl: 28px; --fs-2xl: 40px;
}

    --paper: #0F171A; --sheet: #152125; --sunk: #0B1215;

    --legend: #0A2230; --legend-ink: #EDEAE0; --legend-ink-2: #98B2BE; --legend-rule: #1E3D4D; --legend-hi: #143447;
    --route: #F06BAE; --route-ink: #22091A; --route-tint: #3A1A2B; --route-tint-2: #5C2745;
    --contour: #D49559; --relief: #2A261C; --relief-2: #3A3324;
    --ok: #82C98D; --ok-tint: #17301D; --warn: #E6B95A; --warn-tint: #33280F; --bad: #F2948A; --bad-tint: #3B1B18;
    --t-kraken: #17394A; --e-kraken: #74BADD;
    --t-bisq: #1F3B1B; --e-bisq: #8CC56E;
    --t-payroll: #3A3014; --e-payroll: #DDB258;
    --t-tom: #2F2541; --e-tom: #B99DDE;
    --t-ocean: #133A33; --e-ocean: #66C5AF;
    --t-dust: #2A2926; --e-dust: #A3A096;
    --t-meridian: #41231D; --e-meridian: #EC9483;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 20px -8px rgb(0 0 0 / .5);

}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--sunk); color: var(--ink);
  font: 400 var(--fs-base)/1.4 "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
::selection { background: var(--route-tint-2); color: var(--ink); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: .86em; letter-spacing: -.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* prototype chrome */
.proto { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--paper); position: sticky; top: 0; z-index: 10; }
.proto h1 { font-size: var(--fs-md); font-weight: 600; margin: 0; }
.proto p { margin: 0; color: var(--ink-3); font-size: var(--fs-sm); flex: 1 1 260px; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--legend); color: var(--legend-ink); }
.ghost { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 6px 12px; font-size: var(--fs-sm); font-weight: 500; }

.stage { display: flex; gap: 32px; padding: 32px 24px 64px; align-items: flex-start; justify-content: center; }
.phone-wrap { flex: none; }
.cap { font-size: var(--fs-sm); color: var(--ink-3); margin: 0 0 8px; font-weight: 500; }
[data-frame="phone"] { width: 390px; height: 844px; border-radius: 28px; overflow: hidden; border: 1px solid var(--rule-2); box-shadow: var(--shadow); background: var(--paper); }
[data-desktop-wrap] { flex: 1 1 auto; min-width: 0; position: relative; }
.desk-box { position: relative; }
[data-frame="desktop"] { width: 1280px; height: 800px; transform: scale(var(--scale, 1)); transform-origin: 0 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule-2); box-shadow: var(--shadow); background: var(--paper); position: absolute; top: 0; left: 0; }
body[data-view="phone"] .desk-col { display: none; }
body[data-view="desktop"] .phone-wrap { display: none; }
body[data-view="desktop"] .stage { padding: 24px; }
.desk-col { flex: 1 1 auto; min-width: 0; max-width: 1280px; }
.scroller { height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
@media (max-width: 520px) {
  .proto { padding: 10px 16px; }
  .stage { padding: 0; gap: 0; }
  .phone-wrap .cap { display: none; }
  [data-frame="phone"] { width: 100vw; height: calc(100dvh - 0px); border-radius: 0; border: 0; box-shadow: none; }
}

/* app */
.app { min-height: 100%; display: flex; flex-direction: column; background: var(--paper); container-type: inline-size; }
.bar { background: var(--legend); color: var(--legend-ink); display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 56px; position: sticky; top: 0; z-index: 5; }
.bar .nav { display: flex; gap: 4px; height: 100%; }
.bar .nav button { background: none; border: 0; color: var(--legend-ink-2); font-weight: 500; font-size: var(--fs-base); padding: 0 12px; height: 100%; position: relative; }
.bar .nav button[aria-current="page"] { color: var(--legend-ink); }
.bar .nav button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; background: var(--route); border-radius: 3px 3px 0 0; }
.wsw { position: relative; }
.wsw summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--legend-rule); }
.wsw summary::-webkit-details-marker { display: none; }
.wsw summary:hover { background: var(--legend-hi); }
.wsw .wname { font-weight: 600; font-size: var(--fs-md); }
.wsw .wmeta { font-size: var(--fs-xs); color: var(--legend-ink-2); }
.wsw .menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 260px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; z-index: 8; }
.wsw .menu button { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 12px; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; }
.wsw .menu button:hover { background: var(--sunk); }
.wsw .menu button[aria-current="true"] { background: var(--route-tint); }
.wsw .menu small { color: var(--ink-3); font-size: var(--fs-xs); }
.net { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--legend-hi); color: var(--legend-ink-2); }
.net.regtest { background: var(--warn-tint); color: var(--warn); }
.status { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--legend-ink-2); white-space: nowrap; }
.status b { color: var(--legend-ink); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #5FC27A; flex: none; }
.iconbtn { background: none; border: 1px solid var(--legend-rule); color: var(--legend-ink); width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; }
.iconbtn:hover { background: var(--legend-hi); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.main { flex: 1; padding: 24px; display: grid; gap: 24px; align-content: start; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 16px 0; }
.ph h2, h2.h { font-size: var(--fs-md); font-weight: 600; margin: 0; }
.ph .aside { font-size: var(--fs-sm); color: var(--ink-3); }
.pb { padding: 12px 16px 16px; }
.stack { display: grid; gap: 12px; }
.stack16 { display: grid; gap: 16px; }
.stack24 { display: grid; gap: 24px; align-content: start; }
.pt0 { padding-top: 0; }
.flush { padding: 12px 0 4px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.grp[data-src="kraken"] { --g: var(--t-kraken); } .grp[data-src="bisq"] { --g: var(--t-bisq); } .grp[data-src="payroll"] { --g: var(--t-payroll); }
.grp[data-src="tom"] { --g: var(--t-tom); } .grp[data-src="ocean"] { --g: var(--t-ocean); } .grp[data-src="dust"] { --g: var(--t-dust); } .grp[data-src="meridian"] { --g: var(--t-meridian); }
.amt { white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt .lead { color: var(--ink-3); }
.unit { font-size: .62em; font-weight: 500; color: var(--ink-3); margin-left: .3em; letter-spacing: .02em; }
.in { color: var(--ok); }
.in .lead { color: color-mix(in srgb, var(--ok) 70%, var(--paper)); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 500; padding: 1px 7px; border-radius: 3px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.chip.bad { background: var(--bad-tint); color: var(--bad); }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.route { background: var(--route-tint); color: var(--route); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; padding: 10px 16px; font-weight: 600; font-size: var(--fs-base); border: 1px solid var(--rule-2); background: var(--sheet); transition: background .16s var(--ease); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--route) 88%, black); }
.btn.primary:disabled { background: var(--rule); border-color: var(--rule); color: var(--ink-3); cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: var(--fs-sm); }
.btn.wide { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--route); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); }
.input { width: 100%; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 10px 12px; min-height: 44px; }
.input:focus { outline: 2px solid var(--route); outline-offset: -1px; border-color: transparent; }
.input.err { border-color: var(--bad); }
.hint { font-size: var(--fs-sm); color: var(--ink-3); margin: 0; }

/* phone tab bar */
.tabs { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--legend); color: var(--legend-ink-2); border-top: 1px solid var(--legend-rule); }
.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; height: 56px; align-content: center; padding: 0; font-size: var(--fs-xs); font-weight: 500; color: inherit; }
.tabs button[aria-current="page"] { color: var(--legend-ink); }
.tabs button[aria-current="page"] svg { stroke: var(--route-tint-2); }
:root[data-theme="dark"] .tabs button[aria-current="page"] svg { stroke: var(--route); }

/* connect */
.conn { padding: 40px 24px; display: grid; gap: 32px; max-width: 1040px; margin: 0 auto; width: 100%; }
.mark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-md); }
.mark svg { width: 26px; height: 26px; }
.conn h1 { font-size: var(--fs-xl); font-weight: 600; line-height: 1.1; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance; }
.conn .lede { margin: 0; color: var(--ink-2); max-width: 46ch; }
.conn-grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
.conn-grid > *, .form > * { min-width: 0; }
.recent .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.form { display: grid; gap: 16px; align-content: start; }
.recent { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.recent button { display: flex; justify-content: space-between; gap: 12px; text-align: left; width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
.recent button:hover { border-color: var(--rule-2); }
.recent small { color: var(--ink-3); font-size: var(--fs-xs); white-space: nowrap; }
.routeline { width: 100%; height: 64px; }
.fail { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--rule)); background: var(--sheet); border-radius: 8px; overflow: hidden; }
.fail .fh { background: var(--bad-tint); color: var(--bad); padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; }
.fail .fh h2 { font-size: var(--fs-md); font-weight: 600; margin: 0; color: inherit; }
.fail .fb { padding: 16px; display: grid; gap: 14px; }
.fail p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 600; }
.steps b { font-weight: 600; }
.steps .url { display: inline-block; margin-top: 4px; padding: 4px 8px; background: var(--sunk); border-radius: 4px; }
.alts { border-top: 1px solid var(--rule); padding-top: 14px; display: grid; gap: 8px; font-size: var(--fs-sm); color: var(--ink-2); }
.alts p { font-size: var(--fs-sm); }
.statepick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ink-3); }
.connecting { display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: var(--fs-sm); }
@container (min-width: 900px) {
  .conn { padding: 56px 48px; }
  .conn-grid { grid-template-columns: 400px minmax(0, 1fr); gap: 48px; }
}

/* home */
.bal { display: grid; gap: 4px; padding: 20px 16px; }
.bal .big { font-size: var(--fs-2xl); font-weight: 500; line-height: 1; letter-spacing: -.01em; }
.bal .lbl { margin-bottom: 4px; }
.bal-rows { display: grid; gap: 6px; padding: 0 16px 16px; font-size: var(--fs-sm); }
.bal-rows div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.bal-rows span:first-child { color: var(--ink-2); }
.sync { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--rule); font-size: var(--fs-sm); color: var(--ink-2); }
.sync .dot { background: var(--ok); }
.key { display: grid; }
.key-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--rule); font-size: var(--fs-sm); }
.key-row:first-child { border-top: 0; }
.key-row .n { font-weight: 500; font-size: var(--fs-base); }
.key-row small { display: block; color: var(--ink-3); font-size: var(--fs-xs); }
.sw { width: 28px; height: 18px; display: block; }
.hist { width: 100%; border-collapse: collapse; }
.hist th { text-align: left; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; padding: 10px 16px 8px; border-bottom: 1px solid var(--rule-2); }
.hist td { padding: 11px 16px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.hist tr:last-child td { border-bottom: 0; }
.hist .r { text-align: right; }
.hist .when { color: var(--ink-2); white-space: nowrap; font-size: var(--fs-sm); }
.hist .lab { font-weight: 500; }
.hist .sub { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
.hist .conf { color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; }
.hist .amt { font-size: var(--fs-md); }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 16px; border-top: 1px solid var(--rule); }
.hrow .lab { font-weight: 500; }
.hrow .meta { font-size: var(--fs-sm); color: var(--ink-3); }
.hrow .amt { font-size: var(--fs-md); text-align: right; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule-2); border-radius: 6px; padding: 0 10px; background: var(--sheet); color: var(--ink-3); min-height: 36px; }
.search input { border: 0; background: none; outline: none; width: 180px; padding: 6px 0; }
@container (min-width: 900px) {
  .home { grid-template-columns: 360px 1fr; align-items: start; }
}

/* send */
.send { gap: 16px; }
.coins-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 16px; }
.coins-head h2 { font-size: var(--fs-lg); font-weight: 600; margin: 0; margin-right: auto; }
.coins-head .count { font-size: var(--fs-sm); color: var(--ink-2); }
@container (max-width: 899px) { .coins-head .count { order: 3; flex-basis: 100%; } }
.grp { border-top: 1px solid var(--rule-2); }
.grp-h { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; background: color-mix(in srgb, var(--g) 55%, var(--sheet)); }
.grp-h .n { font-weight: 600; }
.grp-h small { color: var(--ink-2); font-size: var(--fs-xs); display: block; }
.grp-h .tot { font-size: var(--fs-sm); color: var(--ink-2); text-align: right; }
.coin { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 12px; width: 100%; text-align: left; background: var(--sheet); border: 0; border-top: 1px solid var(--rule); padding: 12px 16px; align-items: start; transition: background .16s var(--ease); min-height: 56px; }
.coin:hover { background: color-mix(in srgb, var(--route-tint) 45%, var(--sheet)); }
.coin[aria-checked="true"] { background: var(--route-tint); }
.coin[aria-disabled="true"] { cursor: not-allowed; background: var(--sheet); }
.coin[aria-disabled="true"] .cv, .coin[aria-disabled="true"] .cl { color: var(--ink-3); }
.box { width: 20px; height: 20px; border: 1.5px solid var(--ink-3); border-radius: 4px; display: grid; place-items: center; margin-top: 1px; background: var(--sheet); }
.coin[aria-checked="true"] .box { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.coin[aria-disabled="true"] .box { border-style: dashed; }
.box svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cv { font-size: var(--fs-md); font-weight: 500; }
.cl { grid-column: 2 / 4; font-size: var(--fs-sm); color: var(--ink); }
.cm { grid-column: 2 / 4; display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ink-3); align-items: center; }
.cage { text-align: right; font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; }
.coin .addr { color: var(--ink-3); }
.ctable-h { display: none; }
@container (min-width: 900px) {
  .send { grid-template-columns: minmax(0, 1fr) 440px; align-items: start; }
  .coin { grid-template-columns: 22px 150px 92px 96px minmax(0, 1fr); align-items: center; padding: 10px 16px; }
  .cl, .cm { grid-column: auto; }
  .cv { text-align: right; }
  .cage { text-align: right; }
  .cconf { text-align: right; font-size: var(--fs-sm); color: var(--ink-2); }
  .cm .cmeta-phone { display: none; }
  .ctable-h { display: grid; grid-template-columns: 22px 150px 92px 96px minmax(0, 1fr); gap: 12px; padding: 8px 16px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); border-top: 1px solid var(--rule); }
  .ctable-h span:nth-child(2), .ctable-h span:nth-child(3), .ctable-h span:nth-child(4) { text-align: right; }
  .side { position: sticky; top: 72px; max-height: calc(800px - 88px); overflow-y: auto; scrollbar-width: thin; }
  .coins-col { min-height: 0; }
  .sumpanel { position: sticky; bottom: 0; box-shadow: 0 -10px 20px -14px rgb(0 0 0 / .35); }
}
.cconf-ph { display: none; }
@container (max-width: 899px) { .cconf { display: none; } .cage { display: none; } }

.side { display: grid; gap: 16px; align-content: start; }
.rcpt { display: grid; gap: 12px; padding: 12px 16px 16px; }
.rcpt .row2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@container (min-width: 900px) {
  .rcpt { grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.4fr); align-items: start; }
  .rcpt .row2 { display: contents; }
  .rcpt > .link { grid-column: 1 / -1; justify-self: start; }
}
.addr-ok { display: flex; gap: 6px; align-items: center; font-size: var(--fs-xs); color: var(--ok); }
.addr-ok svg { width: 14px; height: 14px; }

.lmap { display: block; width: 100%; height: auto; }
.lmap .terr { stroke-width: 1.4; }
.lmap .faded { opacity: .38; }
.lmap .tlabel { font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lmap .route { fill: none; stroke: var(--route); stroke-width: 2; stroke-dasharray: 5 4; stroke-linecap: round; }
.lmap .draw { fill: none; stroke: #fff; stroke-width: 6; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .5s var(--ease) forwards; }
.lmap .ready { stroke-dashoffset: 0; animation: none; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.lmap .cdot { stroke-width: 1.5; }
.lmap .xlabel { font-size: 10px; font-weight: 600; fill: var(--ink); }
.lmap .xsub { font-size: 9px; fill: var(--ink-2); }
.verdict { padding: 0 16px 16px; display: grid; gap: 10px; }
.verdict p { margin: 0; color: var(--ink); max-width: 60ch; }
.verdict .why { color: var(--ink-2); font-size: var(--fs-sm); }
.lvl { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-sm); padding: 2px 8px; border-radius: 4px; }
.lvl.none { background: var(--ok-tint); color: var(--ok); }
.lvl.some { background: var(--warn-tint); color: var(--warn); }
.lvl.high { background: var(--bad-tint); color: var(--bad); }
.suggest { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--sunk); border-radius: 6px; padding: 10px 12px; font-size: var(--fs-sm); }
.warnbox { display: flex; gap: 8px; align-items: flex-start; background: var(--warn-tint); color: var(--warn); border-radius: 6px; padding: 10px 12px; font-size: var(--fs-sm); }
.warnbox svg { margin-top: 1px; }

.prof { display: block; width: 100%; height: auto; }
.prof .terrain { fill: var(--relief); }
.prof .edge { fill: none; stroke: var(--contour); stroke-width: 1.6; }
.prof .cont { stroke: var(--contour); stroke-width: .7; opacity: .55; }
.prof .clab { font-size: 9px; fill: var(--contour); font-weight: 600; }
.prof .tick { stroke: var(--rule-2); stroke-width: 1; }
.prof .tlab { font-size: 9px; fill: var(--ink-3); }
.prof .here { stroke: var(--route); stroke-width: 1.6; stroke-dasharray: 4 3; }
.prof .herelab { font-size: 10px; font-weight: 600; fill: var(--route); }
.presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.preset { text-align: left; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 8px 10px; display: grid; gap: 1px; }
.preset b { font-weight: 600; font-size: var(--fs-sm); }
.preset span { font-size: var(--fs-xs); color: var(--ink-3); }
.preset .rate { font-size: var(--fs-base); color: var(--ink); font-weight: 500; }
.preset[aria-pressed="true"] { border-color: var(--route); box-shadow: inset 0 0 0 1px var(--route); background: var(--route-tint); }
.manual { display: flex; align-items: center; gap: 8px; }
.stepper { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.stepper button { border: 0; background: none; width: 40px; min-height: 40px; font-size: 18px; color: var(--ink-2); }
.stepper button:hover { background: var(--sunk); }
.stepper input { width: 64px; border: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); text-align: center; background: none; font-variant-numeric: tabular-nums; }
.sum { display: grid; gap: 0; padding: 4px 16px 16px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--rule-2); font-size: var(--fs-sm); }
.sum div span:first-child { color: var(--ink-2); }
.sum div small { display: block; color: var(--ink-3); font-size: var(--fs-xs); }
.sum .tot { border-bottom: 0; font-size: var(--fs-md); font-weight: 600; padding-top: 10px; }
.sum .tot span:first-child { color: var(--ink); }
.sum .amt { min-width: 11ch; text-align: right; display: inline-block; }
.flash { animation: flash .6s var(--ease); }
@keyframes flash { from { background: var(--route-tint-2); } to { background: transparent; } }

.dock { position: sticky; bottom: 56px; z-index: 4; margin: 0 -1px; background: var(--sheet); border-top: 1px solid var(--rule-2); box-shadow: 0 -6px 16px -10px rgb(0 0 0 / .25); padding: 10px 16px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.dock .l1 { font-size: var(--fs-sm); color: var(--ink-2); }
.dock .l1 b { color: var(--ink); font-weight: 600; }
.dock .lvl { justify-self: start; }

/* sign */
.sign { gap: 16px; }
.stepnav { display: flex; gap: 0; border: 1px solid var(--rule-2); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.stepnav button { flex: 1; border: 0; background: none; padding: 10px 8px; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-3); display: flex; gap: 8px; justify-content: center; align-items: center; }
.stepnav button + button { border-left: 1px solid var(--rule); }
.stepnav button i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.stepnav button[aria-current="step"] { color: var(--ink); background: var(--route-tint); }
.stepnav button[aria-current="step"] i { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.stepnav button.done { color: var(--ink-2); }
.qrcard { display: grid; gap: 16px; padding: 16px; justify-items: center; }
.qr { background: #FFFFFF; color: #101415; border-radius: 6px; padding: 10px; width: 100%; max-width: 340px; aspect-ratio: 1; box-shadow: 0 0 0 1px var(--rule-2); }
.qr svg { display: block; width: 100%; height: 100%; }
.partline { display: flex; align-items: baseline; justify-content: space-between; width: 100%; max-width: 420px; }
.partline .big { font-size: var(--fs-xl); font-weight: 500; }

  function ageOf(c) {
    if (c.height == null) return "unconfirmed";

    if (days < 1) return "today";
    if (days < 60) return days + (days === 1 ? " day" : " days");
    const months = Math.round(days / 30.4);
    if (months < 24) return months + " months";
    return (months / 12).toFixed(1) + " years";
  }

  // BTC with the eight decimals split into sats groups: 0.12 000 000.
  // parts lets a variant dim the leading zeros.
  function btcParts(sats) {
    const neg = sats < 0;
    const s = Math.abs(sats);
    const whole = Math.floor(s / 1e8).toLocaleString("en-GB");
    const frac = String(s % 1e8).padStart(8, "0");
    const grouped = frac.slice(0, 2) + " " + frac.slice(2, 5) + " " + frac.slice(5);
    const full = whole + "." + grouped;
    let i = 0;
    while (i < full.length && /[0. ]/.test(full[i])) i++;
    if (i > 0 && full[i - 1] === ".") i--;
    return { sign: neg ? "−" : "", lead: full.slice(0, i), rest: full.slice(i) || "0", full };
  }
  const btc = (sats) => { const p = btcParts(sats); return p.sign + p.full; };
  const sats = (n) => Math.round(n).toLocaleString("en-GB").replace(/,/g, " ");
  const short = (s, a = 8, b = 6) => s.slice(0, a) + "…" + s.slice(-b);
  const dateOf = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const timeOf = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

  function balances() {
    let confirmed = 0, unconfirmed = 0, frozen = 0;
    for (const c of coins) {
      if (c.frozen) frozen += c.value;
      else if (c.height == null) unconfirmed += c.value;

  // P2WPKH sizes: 10.5 vB overhead, 68 vB per input, 31 vB per output.

    const sel = [...state.selected].map(coinById);

    const vbNoChange = Math.ceil(10.5 + 68 * sel.length + 31 * state.recipients.length);
    const vbChange = vbNoChange + 31;
    const feeNo = Math.ceil(vbNoChange * state.feeRate);
    const feeCh = Math.ceil(vbChange * state.feeRate);
    let change = inputs - sending - feeCh;
    let fee = feeCh, vbytes = vbChange;
    if (change < 546) { change = 0; fee = inputs - sending; vbytes = vbNoChange; }

  // Deterministic QR-looking frame: finder patterns plus seeded noise. Not a

  function qrSvg(seed, modules, fg = "currentColor") {
    let x = seed * 9301 + 49297;
    const rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
    const n = modules, cells = [];
    const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

      if (sep(r, c)) continue;
      if (r === 6 || c === 6) { if ((r + c) % 2 === 0) cells.push(`M${c} ${r}h1v1h-1z`); continue; }

    if (state.screen === "sign" && state.signStage === "export") {

      state.part = (state.part % total) + 1;
      document.querySelectorAll("[data-qr]").forEach((el) => { el.innerHTML = qrSvg(state.part, densities[state.density].modules); });
      document.querySelectorAll("[data-part]").forEach((el) => { el.textContent = state.part; });
      document.querySelectorAll("[data-part-bar]").forEach((el) => { el.style.setProperty("--p", state.part / total); });
      cfg.onTick && cfg.onTick(state.part, total);
    }
    setTimeout(tick, 1000 / state.fps);
  }
  function mount(c) {
    cfg = c;
    document.addEventListener("click", (e) => {
      const g = e.target.closest("[data-goto]");
      if (g) { state.screen = g.dataset.goto; rerender(); return; }
      const v = e.target.closest("[data-view]");
      if (v) { state.view = v.dataset.view; rerender(); return; }
      const th = e.target.closest("[data-theme-toggle]");
      if (th) {
        const dark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        state.theme = dark ? "light" : "dark";
        rerender();
        return;
      }
      act(e);
    });
    document.addEventListener("change", (e) => {
      if (e.target.matches("[data-fee-input]")) {
        const n = Number(e.target.value);
        if (n >= 1 && n <= 500) { state.feeRate = n; rerender(); }
      }
    });
    const params = new URLSearchParams(location.search);
    if (params.get("screen")) state.screen = params.get("screen");
    if (params.get("view")) state.view = params.get("view");
    if (params.get("theme")) state.theme = params.get("theme");
    if (params.get("conn")) state.connection = params.get("conn");
    if (params.get("stage")) state.signStage = params.get("stage");
    addEventListener("resize", fit);
    rerender();
    if (!params.get("still")) tick();
  }

  window.Proto = { TIP, NOW, sources, sourceOrder, coins, history, wallets, mempool, feePresets, state, densities, psbt,
    coinById, confs, spendable, ageOf, btcParts, btc, sats, short, dateOf, timeOf, balances, txSummary, privacy, aheadOf, blocksFor, qrSvg, mount, rerender };
})();
</script>
<script>
(() => {
  const P = window.Proto, S = P.state;
  const SERVER = "fulcrum.tail4b2c1.ts.net";

  const ic = {
    chev: '<path d="M5 7.5l5 5 5-5"/>',
    lock: '<rect x="4.5" y="9" width="11" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 016 0V9"/>',
    plus: '<path d="M10 4.5v11M4.5 10h11"/>',
    check: '<path d="M4.5 10.5l3.5 3.5 7.5-8"/>',
    warn: '<path d="M10 3.5l7 12.5H3z"/><path d="M10 8.5v3.5M10 14.2v.1"/>',
    ext: '<path d="M8 4.5H4.5v11h11V12"/><path d="M11 4.5h4.5V9M15.5 4.5L9 11"/>',

    camera: '<rect x="2.5" y="6" width="15" height="10" rx="1.5"/><path d="M7 6l1.2-2h3.6L13 6"/><circle cx="10" cy="11" r="2.8"/>',
    retry: '<path d="M15.5 10a5.5 5.5 0 11-1.6-3.9"/><path d="M15.5 3.5v3h-3"/>',

    send: '<path d="M10 16V4.5M5 9.5l5-5 5 5"/>',
    recv: '<path d="M10 4v11.5M5 10.5l5 5 5-5"/>',
    coins: '<circle cx="8" cy="8" r="4.5"/><circle cx="12.5" cy="12.5" r="4.5"/>',
    scan: '<path d="M3.5 7V3.5H7M13 3.5h3.5V7M16.5 13v3.5H13M7 16.5H3.5V13M3.5 10h13"/>',
    search: '<circle cx="9" cy="9" r="5"/><path d="M13 13l3.5 3.5"/>',
    broadcast: '<circle cx="10" cy="10" r="1.6"/><path d="M6.5 13.5a5 5 0 010-7M13.5 6.5a5 5 0 010 7M4.2 15.8a8.2 8.2 0 010-11.6M15.8 4.2a8.2 8.2 0 010 11.6"/>',
  };
  const I = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 20 20" aria-hidden="true">${ic[n]}</svg>`;

  const amt = (s, opt = {}) => {
    const p = P.btcParts(s);
    const sign = s < 0 ? "−" : opt.plus && s > 0 ? "+" : "";
    return `<span class="amt${opt.plus && s > 0 ? " in" : ""}">${sign}<span class="lead">${p.lead}</span>${p.rest}${opt.unit ? '<span class="unit">BTC</span>' : ""}</span>`;
  };

  // Territory geometry: one blob per source, used at map scale and as the key swatch.
  const terr = {
    kraken: [64, 58, 56, 38, 3], bisq: [178, 46, 50, 31, 7], payroll: [292, 60, 52, 38, 11],
    tom: [50, 166, 40, 28, 5], ocean: [140, 168, 42, 30, 9], meridian: [232, 172, 42, 28, 13], dust: [314, 166, 34, 24, 2],
  };
  const TX = [180, 112];
  function blob(cx, cy, rx, ry, seed, n = 9) {
    let x = seed * 7919 + 17;
    const r = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, k = 0.82 + r() * 0.3;
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d + "Z";
  }
  const swatch = (sid) => {
    const [, , , , seed] = terr[sid];
    return `<svg class="sw" viewBox="0 0 28 18" aria-hidden="true"><path d="${blob(14, 9, 12.5, 7.5, seed)}" fill="var(--t-${sid})" stroke="var(--e-${sid})" stroke-width="1.2"/></svg>`;
  };

  let lastSel = new Set(S.selected);
  let lastNums = {};

  function linkMap(kind) {
    const p = P.privacy();
    const selSources = new Set(p.linked.map((l) => l.id));
    let g = "", routes = "", masks = "", dots = "", labels = "";
    for (const sid of P.sourceOrder) {
      const [cx, cy, rx, ry, seed] = terr[sid];
      const on = selSources.has(sid);
      g += `<path class="terr${on ? "" : " faded"}" d="${blob(cx, cy, rx, ry, seed)}" fill="var(--t-${sid})" stroke="var(--e-${sid})"/>`;
      labels += `<text class="tlabel${on ? "" : " faded"}" x="${cx}" y="${cy - ry * 0.42}" text-anchor="middle" fill="var(--e-${sid})">${P.sources[sid].short}</text>`;
      const cs = P.coins.filter((c) => c.source === sid);
      cs.forEach((c, k) => {
        const x = cx + (k - (cs.length - 1) / 2) * 16, y = cy + 7;
        const sel = S.selected.has(c.id);
        if (sel) {
          const mx = (x + TX[0]) / 2 + (y < TX[1] ? -10 : 10), my = (y + TX[1]) / 2;
          const d = `M${x} ${y}Q${mx} ${my} ${TX[0]} ${TX[1]}`;
          const id = `m-${kind}-${c.id}`;
          const fresh = !lastSel.has(c.id);
          masks += `<mask id="${id}" maskUnits="userSpaceOnUse"><path class="draw${fresh ? "" : " ready"}" d="${d}"/></mask>`;
          routes += `<path class="route" d="${d}" mask="url(#${id})"/>`;
        }
        dots += c.frozen
          ? `<g transform="translate(${x} ${y})"><circle r="4.5" fill="var(--sheet)" stroke="var(--ink-3)" class="cdot" stroke-dasharray="2 1.5"/></g>`
          : `<circle cx="${x}" cy="${y}" r="${sel ? 5 : 4.5}" class="cdot" fill="${sel ? "var(--route)" : "var(--sheet)"}" stroke="${sel ? "var(--sheet)" : "var(--ink-2)"}"/>`;
      });
    }
    const tri = `<g transform="translate(${TX[0]} ${TX[1]})"><path d="M0 -9L8 6H-8Z" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.6"/><circle r="2" cy="1.5" fill="var(--ink)"/></g>`;
    const txl = `<text class="xlabel" x="${TX[0] + 13}" y="${TX[1] + 2}">This transaction</text>`;
    return `<svg class="lmap" viewBox="0 0 360 212" role="img" aria-label="Map of your coin sources. Selected coins are joined by routes to this transaction.">
      <defs>${masks}</defs>${g}${labels}${routes}${dots}${tri}${txl}</svg>`;
  }

  function verdict() {
    const p = P.privacy();
    const n = p.linked.length;
    const names = p.linked.map((l) => l.name);
    const list = names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names.at(-1) : names[0];
    let badge, text, why = "";
    if (n === 0) { badge = `<span class="lvl none">Nothing selected</span>`; text = "Pick coins from the list, or let auto-select choose."; }
    else if (n === 1) { badge = `<span class="lvl none">${I("check")}No new links</span>`; text = `All selected coins come from ${list}. They are already linked, so this adds nothing new.`; }
    else {
      const words = ["", "", "two", "three", "four", "five", "six", "seven"];
      badge = `<span class="lvl ${p.level}">${I("warn")}Links ${n} sources</span>`;
      text = `This spends coins from ${words[n]} separate sources, permanently linking them: ${list}. Anyone reading the chain can assume they belong to one person.`;
      if (p.kyc.length && p.nonKyc.length) {
        const k = p.kyc.map((s) => s.short).join(" and "), nk = p.nonKyc.map((s) => s.name).join(" and ");
        why = `${k} ${p.kyc.length > 1 ? "know" : "knows"} who you are, so ${nk} would stop being private.`;
      }
    }
    const alt = n > 1 && p.alt ? `<div class="suggest"><span>Spend only ${p.alt.name} instead: ${amt(p.alt.total)} covers this payment.</span><button class="btn sm" data-act="alt">Use those coins</button></div>` : "";
    const foreign = p.foreign.length ? `<div class="warnbox">${I("warn")}<span>${p.foreign.map((c) => c.label).join(", ")} is an unconfirmed payment from someone else. They can still replace it, and this transaction would fail with it.</span></div>` : "";
    return { badge, html: `<p>${text}</p>${why ? `<p class="why">${why}</p>` : ""}${alt}${foreign}` };
  }

  function profile(kind) {
    const W = 360, H = 120, L = 28, B = 22, maxX = 12;
    const ly = (r) => (H - B) - (Math.log(Math.min(r, 60)) / Math.log(60)) * (H - B - 24);
    const lx = (mvb) => L + (Math.min(mvb, maxX) / maxX) * (W - L - 6);
    let cum = 0, d = `M${lx(0)} ${H - B}L${lx(0)} ${ly(60)}`;
    for (const b of P.mempool) {
      d += `L${lx(cum)} ${ly(b.to)}`;
      cum += b.mvb;
      d += `L${lx(cum)} ${ly(b.from)}`;
      if (cum > maxX) break;
    }
    d += `L${lx(maxX)} ${H - B}Z`;
    const id = `clip-${kind}`;
    const conts = [2, 5, 10, 20, 50].map((r) => `<line class="cont" x1="${L}" x2="${W}" y1="${ly(r)}" y2="${ly(r)}"/>`).join("");
    const clabs = [2, 5, 10, 20, 50].map((r) => `<text class="clab" x="${L - 4}" y="${ly(r) + 3}" text-anchor="end">${r}</text>`).join("");
    let ticks = "";
    for (let i = 0; i <= maxX; i += 2) ticks += `<line class="tick" x1="${lx(i)}" x2="${lx(i)}" y1="${H - B}" y2="${H - B + 4}"/><text class="tlab" x="${lx(i)}" y="${H - B + 14}" text-anchor="middle">${i}</text>`;
    const ahead = P.aheadOf(S.feeRate);
    const hx = lx(ahead), off = ahead > maxX;
    const here = `<line class="here" x1="${hx}" x2="${hx}" y1="10" y2="${H - B}"/><text class="herelab" x="${off ? hx - 4 : hx + 5}" y="18" text-anchor="${off ? "end" : "start"}">You are here${off ? ", further down" : ""}</text>`;
    return `<svg class="prof" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mempool cross-section. ${ahead.toFixed(1)} MvB of transactions pay more than ${S.feeRate} sat/vB.">
      <defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>
      <path class="terrain" d="${d}"/><g clip-path="url(#${id})">${conts}</g>
      <path class="edge" d="${d.replace(/Z$/, "")}"/>${clabs}${ticks}${here}
      <text class="tlab" x="${W - 6}" y="${H - 1}" text-anchor="end">MvB ahead of you, about one block each</text>
      <text class="clab" x="2" y="9">sat/vB, log scale</text></svg>`;
  }

  const eta = (rate) => {
    const b = P.blocksFor(rate), m = b * 10;
    return m < 60 ? `about ${m} min` : m < 240 ? `about ${Math.round(m / 60)} hour${m >= 90 ? "s" : ""}` : "several hours";
  };
  const presetName = { next: "Fast", hour: "Within an hour", economy: "Economy", floor: "No rush" };

  // shells
  function topbar(kind, here) {
    const w = P.wallets.find((x) => x.id === S.wallet);
    const menu = P.wallets.map((x) => `<button data-act="wallet" data-v="${x.id}" aria-current="${x.id === S.wallet}"><span>${x.name}</span><small>${x.kind} &middot; ${x.network}</small></button>`).join("") +
      `<button><span class="link">Add a wallet</span></button>`;
    const sw = `<details class="wsw"><summary><span><span class="wname">${w.name}</span>${kind === "desktop" ? ` <span class="wmeta">${w.kind}</span>` : ""}</span>${w.network !== "mainnet" ? `<span class="net regtest">${w.network}</span>` : ""}${I("chev")}</summary><div class="menu">${menu}</div></details>`;
    if (kind === "phone") {
      return `<header class="bar">${sw}<div class="status"><span class="dot" aria-hidden="true"></span><span>${P.sats(P.TIP)}</span></div><button class="iconbtn" aria-label="Lock">${I("lock")}</button></header>`;
    }
    const nav = [["home", "Home"], ["send", "Send"], ["recv", "Receive"], ["coins", "Coins"], ["addr", "Addresses"]]
      .map(([id, n]) => `<button ${["home", "send"].includes(id) ? `data-goto="${id}"` : ""} ${here === id ? 'aria-current="page"' : ""}>${n}</button>`).join("");
    return `<header class="bar">${sw}<nav class="nav" aria-label="Main">${nav}</nav><div class="status"><span class="dot" aria-hidden="true"></span><span>Connected to <b>${SERVER}</b> &middot; block ${P.sats(P.TIP)}</span></div><button class="iconbtn" aria-label="Lock">${I("lock")}</button></header>`;
  }
  function tabbar(here) {
    const t = [["home", "Home", "home"], ["send", "Send", "send"], ["recv", "Receive", "recv"], ["coins", "Coins", "coins"]];
    return `<nav class="tabs" aria-label="Main">${t.map(([id, n, i]) => `<button ${["home", "send"].includes(id) ? `data-goto="${id}"` : ""} ${here === id ? 'aria-current="page"' : ""}>${I(i)}${n}</button>`).join("")}</nav>`;
  }

  // screens
  function connect(kind) {
    const host = S.server.replace("wss://", "");
    const mark = `<div class="mark"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3l10 18H3z" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><circle cx="13" cy="15" r="2.6" fill="var(--route)"/></svg>Watch-only wallet</div>`;
    const broken = S.connection === "cert";
    const routeSvg = `<svg class="routeline" viewBox="0 0 360 64" role="img" aria-label="${broken ? "The route from this tab to your server stops at the certificate." : "This tab talks only to your server."}">
      <circle cx="18" cy="32" r="7" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.6"/>
      <text x="18" y="58" text-anchor="middle" font-size="11" fill="var(--ink-2)">This tab</text>
      <path d="M28 32H${broken ? 196 : 330}" stroke="var(--route)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
      ${broken ? `<path d="M198 24l14 16M212 24l-14 16" stroke="var(--bad)" stroke-width="2.4" stroke-linecap="round"/><text x="205" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="var(--bad)">certificate</text><path d="M218 32H330" stroke="var(--rule-2)" stroke-width="2" stroke-dasharray="5 4"/>` : ""}
      <g transform="translate(342 32)"><path d="M0 -9L8 6H-8Z" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.6"/><circle r="2" cy="1.5" fill="var(--ink)"/></g>
      <text x="352" y="58" text-anchor="end" font-size="11" fill="var(--ink-2)">Your server</text></svg>`;
    const form = `<div class="form">
      <div class="field"><label for="srv-${kind}">Electrum server address</label>
        <input id="srv-${kind}" class="input mono${broken ? " err" : ""}" value="${S.server}" spellcheck="false" autocomplete="off" inputmode="url" aria-describedby="srvh-${kind}">
        <p class="hint" id="srvh-${kind}">wss:// and the port your server listens on for WebSocket Secure, often 50004.</p></div>
      ${S.connection === "connecting" ? `<div class="connecting">Connecting to ${host}. Waiting up to 10 seconds for an answer.</div>` : ""}
      <button class="btn primary wide" data-act="conn" data-v="connecting">${broken ? I("retry") + "Retry connection" : "Connect"}</button>
      <div class="recent"><span class="lbl">Used before</span>
        <button><span class="mono">wss://${SERVER}:50004</span><small>3 days ago</small></button></div>
      <p class="hint">There is no default or public server. If yours is unreachable, this app does nothing rather than ask someone else.</p>
    </div>`;
    const guide = broken ? `<section class="fail" aria-live="polite">
      <div class="fh">${I("warn")}<h2>The browser rejected this server's certificate</h2></div>
      <div class="fb">
        <p>Your server at <span class="mono">${host}</span> answered, but with a certificate this browser does not trust, usually because it is self-signed. WebSocket connections have no "proceed anyway" button, so you accept the certificate once in an ordinary tab.</p>
        <ol class="steps">
          <li><div><b>Open the server's https address in a new tab.</b><br><span class="url mono">https://${host}</span> <button class="link">Open it ${I("ext")}</button></div></li>
          <li><div><b>Check the warning is about your own server, then accept it.</b> In Chrome choose Advanced, then Proceed. In Firefox choose Advanced, then Accept the Risk. In Safari choose Show Details, then visit this website.</div></li>
          <li><div><b>Expect a blank page or an error there.</b> That is normal; the server only speaks Electrum. Close the tab.</div></li>
          <li><div><b>Come back and choose Retry connection.</b></div></li>
        </ol>
        <div class="alts">
          <p>To stop this happening on every device, put your server behind Tailscale with a real certificate. <button class="link">Read the Tailscale guide</button></p>
          <p>Running this app from the local container? It can use plain ws:// on your own network.</p>
        </div>
      </div></section>` : `<section class="panel"><div class="ph"><h2>What happens when you connect</h2></div><div class="pb"><p class="hint">The app asks your server for block headers and the history of your addresses. Your addresses and transactions go to that server and nowhere else.</p></div></section>`;
    const pick = `<div class="statepick">Prototype state: <div class="seg"><button data-act="conn" data-v="idle" aria-pressed="${S.connection === "idle"}">First visit</button><button data-act="conn" data-v="connecting" aria-pressed="${S.connection === "connecting"}">Connecting</button><button data-act="conn" data-v="cert" aria-pressed="${S.connection === "cert"}">Certificate rejected</button></div></div>`;
    return `<div class="app"><div class="conn">${mark}<div><h1>Connect to your Electrum server</h1><p class="lede">This wallet talks only to a server you run. Nothing about your wallet is sent anywhere else.</p></div>${routeSvg}<div class="conn-grid">${form}${guide}</div>${pick}</div></div>`;
  }

  function home(kind) {
    const b = P.balances();
    const balance = `<section class="panel"><div class="bal"><span class="lbl">Confirmed balance</span><span class="big">${amt(b.confirmed, { unit: true })}</span></div>
      <div class="bal-rows"><div><span>Unconfirmed</span>${amt(b.unconfirmed, { plus: true })}</div><div><span>Frozen, not spendable</span>${amt(b.frozen)}</div></div>
      <div class="sync"><span class="dot" aria-hidden="true"></span><span>Up to date at block ${P.sats(P.TIP)}. Watching ${SERVER}.</span></div></section>`;
    const totals = {};
    for (const c of P.coins) totals[c.source] = (totals[c.source] || 0) + c.value;
    const key = `<section class="panel"><div class="ph"><h2>Sources</h2><span class="aside">Coins already linked to each other</span></div><div class="pb key">${P.sourceOrder.map((sid) => `<div class="key-row">${swatch(sid)}<div><span class="n">${P.sources[sid].name}</span><small>${P.sources[sid].note}</small></div>${amt(totals[sid])}</div>`).join("")}</div></section>`;
    const confTxt = (h) => (h == null ? `<span class="chip warn">Unconfirmed</span>` : `${P.sats(P.confs(h))} conf`);
    const sub = (t) => {
      let s = "";
      if (t.height == null && t.amount < 0) s += `<span class="chip">Replaceable, ${t.feeRate} sat/vB</span><button class="btn sm">Bump fee</button>`;
      if (t.height == null && t.amount > 0) s += `<span class="chip warn">From someone else, can still be replaced</span>`;
      return s ? `<div class="sub">${s}</div>` : "";
    };
    let hist;
    if (kind === "desktop") {
      hist = `<section class="panel"><div class="ph"><h2>Transactions</h2><label class="search">${I("search")}<span class="sr">Search transactions</span><input placeholder="Label, amount or date"></label></div><div class="pb flush"><table class="hist"><thead><tr><th>Date</th><th>Label</th><th class="r">Confirmations</th><th class="r">Amount</th></tr></thead><tbody>${P.history.map((t) => `<tr><td class="when">${P.dateOf(t.time)}<br>${P.timeOf(t.time)}</td><td><span class="lab">${t.label}</span>${sub(t)}</td><td class="r conf">${confTxt(t.height)}</td><td class="r">${amt(t.amount, { plus: true })}</td></tr>`).join("")}</tbody></table></div></section>`;
    } else {
      hist = `<section class="panel"><div class="ph"><h2>Transactions</h2><span class="aside">Newest first</span></div><div class="pb flush">${P.history.map((t) => `<div class="hrow"><span class="lab">${t.label}</span>${amt(t.amount, { plus: true })}<span class="meta">${P.dateOf(t.time)} &middot; ${t.height == null ? "unconfirmed" : P.sats(P.confs(t.height)) + " conf"}</span><span></span>${sub(t)}</div>`).join("")}</div></section>`;
    }
    const left = kind === "desktop" ? `<div class="stack24">${balance}${key}</div>` : balance;
    return `<div class="app">${topbar(kind, "home")}<div class="main home">${left}${hist}${kind === "phone" ? key : ""}</div>${kind === "phone" ? tabbar("home") : ""}</div>`;
  }

  function coinRow(c) {
    const sel = S.selected.has(c.id), ok = P.spendable(c);
    const chips = [];
    if (c.frozen) chips.push(`<span class="chip">Frozen</span>`);
    if (c.status === "own-change") chips.push(`<span class="chip ok">Your change, unconfirmed</span>`);
    if (c.status === "foreign-unconfirmed") chips.push(`<span class="chip warn">${I("warn")}Unconfirmed, from someone else</span>`);
    const conf = c.height == null ? "0 conf" : `${P.sats(P.confs(c.height))} conf`;
    return `<button class="coin" role="checkbox" aria-checked="${sel}" ${ok ? "" : 'aria-disabled="true"'} data-act="coin" data-v="${c.id}">
      <span class="box">${sel ? `<svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>` : ""}</span>
      <span class="cv">${amt(c.value)}</span>
      <span class="cage">${P.ageOf(c)}</span>
      <span class="cconf">${conf}</span>
      <span class="cm"><span class="cl">${c.label}</span><span class="cmeta-phone">${P.ageOf(c)} &middot; ${conf}</span>${chips.join("")}</span>
    </button>`;
  }

  function send(kind) {
    const tx = P.txSummary(), p = P.privacy(), v = verdict();
    const spendTotal = P.coins.filter(P.spendable).reduce((a, c) => a + c.value, 0);
    const groups = P.sourceOrder.map((sid) => {
      const cs = P.coins.filter((c) => c.source === sid);
      const s = P.sources[sid];
      return `<div class="grp" data-src="${sid}"><div class="grp-h">${swatch(sid)}<div><span class="n">${s.name}</span><small>${s.note}</small></div><span class="tot">${cs.length} coin${cs.length > 1 ? "s" : ""}<br>${amt(cs.reduce((a, c) => a + c.value, 0))}</span></div>${cs.map(coinRow).join("")}</div>`;
    }).join("");
    const coinsPanel = `<section class="panel coins-col"><div class="coins-head"><h2>Coins</h2><span class="count">${tx.sel.length} of ${P.coins.filter(P.spendable).length} selected &middot; ${amt(tx.inputs)}</span>
      <button class="btn sm" data-act="auto">Auto-select</button><button class="btn sm" data-act="clear">Clear</button></div>
      <div class="ctable-h"><span></span><span>Value</span><span>Age</span><span>Confirmations</span><span>Label</span></div>${groups}</section>`;
    const r = S.recipients[0];
    const rcpt = `<section class="panel"><div class="ph"><h2>Pay to</h2><button class="link">${I("scan")} Scan</button></div><div class="rcpt">
      <div class="field"><label for="to-${kind}">Address</label><input id="to-${kind}" class="input mono" value="${r.address}" spellcheck="false"><span class="addr-ok">${I("check")}Valid mainnet address, never paid before</span></div>
      <div class="row2"><div class="field"><label for="amt-${kind}">Amount, BTC</label><input id="amt-${kind}" class="input" value="${P.btc(r.amount)}" inputmode="decimal"></div>
      <div class="field"><label for="lab-${kind}">Label</label><input id="lab-${kind}" class="input" value="${r.label}"></div></div>
      <button class="link">${I("plus")} Add another recipient</button></div></section>`;
    const privacyPanel = `<section class="panel" aria-live="polite"><div class="ph"><h2>What this links</h2>${v.badge}</div><div class="pb">${linkMap(kind)}</div><div class="verdict">${v.html}</div></section>`;
    const fee = `<section class="panel"><div class="ph"><h2>Fee</h2><span class="aside">From your node's mempool</span></div><div class="pb stack">${profile(kind)}
      <div class="presets">${P.feePresets.map((f) => `<button class="preset" data-act="fee" data-v="${f.rate}" aria-pressed="${S.feeRate === f.rate}"><b>${presetName[f.id]}</b><span class="rate">${f.rate} sat/vB</span><span>${eta(f.rate)}</span></button>`).join("")}</div>
      <div class="manual"><span class="lbl" id="fr-${kind}">Custom rate</span><span class="stepper"><button data-act="fee-step" data-v="-1" aria-label="Lower fee rate">−</button><input data-fee-input aria-labelledby="fr-${kind}" value="${S.feeRate}" inputmode="decimal"><button data-act="fee-step" data-v="1" aria-label="Raise fee rate">+</button></span><span class="hint">sat/vB, ${eta(S.feeRate)}</span></div></div></section>`;
    const changeIdx = "m/84'/0'/0'/1/10";
    const fl = (k) => (lastNums[k] !== undefined && lastNums[k] !== tx[k] ? " flash" : "");
    const summary = `<section class="panel sumpanel"><div class="ph"><h2>Summary</h2><span class="aside">Replaceable (RBF)</span></div><div class="sum">
      <div><span>Coins in (${tx.sel.length})</span><span class="${fl("inputs")}">${amt(tx.inputs)}</span></div>
      <div><span>Sending</span>${amt(tx.sending)}</div>
      <div><span>Fee<small>${S.feeRate} sat/vB &middot; ${tx.vbytes} vB</small></span><span class="${fl("fee")}">${P.sats(tx.fee)} sats</span></div>
      <div><span>Change back to you<small class="mono">${changeIdx}</small></span><span class="${fl("change")}">${tx.change ? amt(tx.change) : "None"}</span></div>
      <div class="tot"><span>Total leaving the wallet</span><span class="${fl("total")}">${amt(tx.total, { unit: true })}</span></div>
      </div><div class="pb pt0">${tx.ok ? `<button class="btn primary wide" data-goto="sign">Review and sign</button>` : `<button class="btn primary wide" disabled>${tx.sel.length ? `Short by ${P.sats(tx.shortBy)} sats` : "Select coins to pay from"}</button>`}</div></section>`;
    if (kind === "desktop") {
      return `<div class="app">${topbar(kind, "send")}<div class="main send"><div class="stack16">${rcpt}${coinsPanel}</div><div class="side">${privacyPanel}${fee}${summary}</div></div></div>`;
    }
    const dock = `<div class="dock"><span class="l1"><b>${tx.sel.length} coins</b>, ${amt(tx.inputs)} in &middot; fee ${P.sats(tx.fee)} sats</span>${tx.ok ? `<button class="btn primary sm" data-goto="sign">Review</button>` : `<button class="btn primary sm" disabled>Review</button>`}${v.badge}<span class="l1">${tx.change ? "Change " + amt(tx.change) : ""}</span></div>`;
    return `<div class="app">${topbar(kind, "send")}<div class="main send">${rcpt}${coinsPanel}${privacyPanel}${fee}${summary}</div>${dock}${tabbar("send")}</div>`;
  }

  function sign(kind) {
    const tx = P.txSummary();
    const d = P.densities[S.density];
    const st = S.signStage;
    const order = ["export", "scan", "verified"];
    const steps = [["export", "Show"], ["scan", "Scan back"], ["verified", "Broadcast"]]
      .map(([id, n], i) => `<button data-act="stage" data-v="${id}" ${st === id ? 'aria-current="step"' : ""} class="${order.indexOf(st) > i ? "done" : ""}"><i>${order.indexOf(st) > i ? "✓" : i + 1}</i>${n}</button>`).join("");
    const facts = `<section class="panel"><div class="ph"><h2>${S.recipients[0].label}</h2></div><div class="facts">
      <div><span>Sending</span>${amt(tx.sending)}</div><div><span>To</span><span class="mono">${P.short(S.recipients[0].address, 10, 8)}</span></div>
      <div><span>Fee</span><span>${P.sats(tx.fee)} sats, ${S.feeRate} sat/vB</span></div><div><span>Change</span>${amt(tx.change)}</div>
      <div><span>Inputs</span><span>${tx.sel.length} coins from ${P.privacy().linked.length} sources</span></div><div><span>Replaceable</span><span>Yes (RBF)</span></div></div></section>`;
    let body;
    if (st === "export") {
      const segs = Array.from({ length: d.parts }, (_, i) => `<i data-seg="${i + 1}" class="${i + 1 === S.part ? "on" : ""}"></i>`).join("");
      body = `<section class="panel qrcard">
        <div class="qr" data-qr>${P.qrSvg(S.part, d.modules, "#101415")}</div>
        <div><h2 class="h">Show this to your signer</h2><p class="hint">On a SeedSigner choose Scan, then hold this screen steady in front of its camera. The code cycles through every part; the signer collects them in any order.</p></div>
        <div class="partline"><span class="big">Part <span data-part>${S.part}</span> <small>of ${d.parts}</small></span><span class="hint">${S.fps} frames a second</span></div>
        <div class="scalebar" aria-hidden="true"><div class="segs">${segs}</div><div class="ends"><span>1</span><span>${d.parts} parts</span></div></div>
        <div class="ctrls">
          <div class="ctrl"><span class="lbl">Speed, frames per second</span><div class="seg" role="group" aria-label="Speed, frames per second">${[2, 4, 6, 8].map((f) => `<button data-act="fps" data-v="${f}" aria-pressed="${S.fps === f}">${f}</button>`).join("")}</div></div>
          <div class="ctrl"><span class="lbl">Density</span><div class="seg" role="group" aria-label="Density">${Object.entries(P.densities).map(([k, x]) => `<button data-act="density" data-v="${k}" aria-pressed="${S.density === k}">${k[0].toUpperCase() + k.slice(1)}, ${x.parts} parts</button>`).join("")}</div><p class="hint">Lower density is easier for a weak camera to read but takes longer.</p></div>
          <div class="acts"><button class="btn primary" data-act="stage" data-v="scan">${I("camera")}Signed it, scan it back</button><button class="btn">${I("file")}Save PSBT file</button></div>
        </div></section>`;
    } else if (st === "scan") {
      const cells = Array.from({ length: 40 }, (_, i) => `<i class="${S.captured.has(i + 1) ? "on" : ""}" title="Part ${i + 1}"></i>`).join("");
      body = `<section class="panel qrcard">
        <div class="viewfinder" role="img" aria-label="Camera view"><div class="q">${P.qrSvg(7, 41)}</div><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><span class="live"><span class="dot"></span>Camera on</span></div>
        <div><h2 class="h">Point your camera at the signer</h2><p class="hint">Keep the signed code in view. Parts arrive in any order; gaps fill in as the code loops.</p></div>
        <div class="partline"><span class="big">${S.captured.size} <small>of 40 parts captured</small></span></div>
        <div class="grid40" aria-label="${S.captured.size} of 40 parts captured">${cells}</div>
        <div class="acts"><button class="btn primary" data-act="stage" data-v="verified">Simulate the last parts</button><button class="btn">${I("file")}Load signed file instead</button><button class="btn" data-act="stage" data-v="export">Back</button></div>
      </section>`;
    } else {
      body = `<section class="panel"><div class="ph"><h2>Signed and checked</h2><span class="chip ok">Ready to broadcast</span></div><div class="pb stack16">
        <ul class="checks">
          <li><span class="tick">${I("check")}</span><span>Every input is signed</span><small>${tx.sel.length} of ${tx.sel.length}</small></li>
          <li><span class="tick">${I("check")}</span><span>Outputs match what you built</span><small>2 of 2</small></li>
          <li><span class="tick">${I("check")}</span><span>Fee matches</span><small>${P.sats(tx.fee)} sats</small></li>
        </ul>
        <p class="hint">Broadcasting sends the transaction to ${SERVER} only. Your server relays it to the network.</p>
        <div class="acts"><button class="btn primary">${I("broadcast")}Broadcast through your server</button><button class="btn" data-goto="send">Discard</button></div>
      </div></section>`;
    }
    return `<div class="app">${topbar(kind, "send")}<div class="main sign"><nav class="stepnav" aria-label="Signing steps">${steps}</nav><div class="signwrap">${body}${facts}</div></div>${kind === "phone" ? tabbar("send") : ""}</div>`;
  }

  P.mount({
    render(screen, kind) {
      if (screen === "connect") return connect(kind);
      if (screen === "home") return home(kind);
      if (screen === "sign") return sign(kind);
      return send(kind);
    },
    after() {
      lastSel = new Set(S.selected);
      const tx = P.txSummary();
      lastNums = { inputs: tx.inputs, fee: tx.fee, change: tx.change, total: tx.total };
    },
    onTick(part) {
      document.querySelectorAll("[data-seg]").forEach((el) => el.classList.toggle("on", Number(el.dataset.seg) === part));
    },
  });
})();
</script>
</body>
</html>
