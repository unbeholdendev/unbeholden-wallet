name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: docker
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Second build is byte-identical
        run: |
          bun run --silent hashes > ../hashes-1.txt
          rm -rf dist
          bun run build
          bun run --silent hashes | diff ../hashes-1.txt -
      - run: bun run build:demo
      - name: The wallet build holds no demo code
        run: "! grep -rq 'Kraken withdrawal' dist"
