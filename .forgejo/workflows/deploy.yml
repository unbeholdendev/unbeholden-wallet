name: deploy

on:
  push:
    tags: ["v*"]

# Runs queue rather than overlap, so an older deploy cannot finish last.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        app: [wallet, demo, site]
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ github.repository }}${{ matrix.app != 'wallet' && format('-{0}', matrix.app) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        with:
          # The host daemon keeps its layer cache between runs. The default driver holds
          # its own cache in a builder that is deleted when the job ends.
          driver: docker

      - uses: docker/login-action@v4
        if: matrix.app != 'wallet'
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/metadata-action@v6
        if: matrix.app != 'wallet'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=

      - uses: docker/build-push-action@v7
        if: matrix.app != 'wallet'
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}

      - name: Wait for GitHub wallet image
        if: matrix.app == 'wallet'
        id: wallet
        timeout-minutes: 25
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image=$(bash scripts/wait-wallet-image.sh ghcr.io/unbeholdendev/unbeholden-wallet "$RELEASE_TAG" "$(git rev-parse HEAD)")
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Pin image and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP: ${{ matrix.app }}
          WALLET_APP_ID: ${{ vars.DOKPLOY_APP_ID }}
          DEMO_APP_ID: ${{ vars.DOKPLOY_DEMO_APP_ID }}
          SITE_APP_ID: ${{ vars.DOKPLOY_SITE_APP_ID }}
          DEPLOY_IMAGE: ${{ steps.wallet.outputs.image || format('{0}:{1}', env.IMAGE, steps.meta.outputs.version) }}
        run: |
          set -euo pipefail
          # Picked here, not with `&& ||` in the expression: an empty demo or site ID would fall through to the wallet's.
          case "$APP" in demo) APP_ID=$DEMO_APP_ID ;; site) APP_ID=$SITE_APP_ID ;; *) APP_ID=$WALLET_APP_ID ;; esac
          : "${APP_ID:?no Dokploy app ID set for $APP}"
          curl -fsS -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$DEPLOY_IMAGE\"}"
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"
