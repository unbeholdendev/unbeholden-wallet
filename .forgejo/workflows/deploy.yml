name: deploy

on:
  push:
    tags: ["v*"]

# Runs queue rather than overlap, so an older deploy cannot finish last.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    strategy:
      matrix:
        app: [wallet, demo]
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ github.repository }}${{ matrix.app == 'demo' && '-demo' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        with:
          # The host daemon keeps its layer cache between runs. The default driver holds
          # its own cache in a builder that is deleted when the job ends.
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.app == 'demo' && 'demo' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}

      - name: Pin image to commit and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP: ${{ matrix.app }}
          WALLET_APP_ID: ${{ vars.DOKPLOY_APP_ID }}
          DEMO_APP_ID: ${{ vars.DOKPLOY_DEMO_APP_ID }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Picked here, not with `&& ||` in the expression: an empty demo ID would fall through to the wallet's.
          if [ "$APP" = demo ]; then APP_ID=$DEMO_APP_ID; else APP_ID=$WALLET_APP_ID; fi
          : "${APP_ID:?no Dokploy app ID set for $APP}"
          curl -fsS -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE:$TAG\"}"
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"
